        setEditingRouteId(route.id);
        setInsertIndexMode(null);
        setStudioForm({
          code: route.code || 'R',
          name: route.name || '',
          color_hex: route.color_hex || '#2563EB',
          service_type: route.service_type || 'city_bus',
          operation_status: route.operation_status || 'operating',
          routing_tier: tier,
          geometry_type: route.geometry_type || 'verified_road_network',
          snap_to_road: route.geometry_type !== 'conceptual_user_drawn',
          auto_curbside_snap: true,
          default_new_station_level: route.service_type === 'lrt_concept' ? 'elevated' : 'at_grade',
          is_admin_locked: Boolean(route.is_admin_locked),
          stop_ids: [...(route.stop_ids || [])],
          road_coordinates: route.road_coordinates || null,
          segment_layers: route.segment_layers || null,
          road_distance_meters: route.road_distance_meters || null,
          soi_segments_detected: [],
          proposer_name: route.proposal?.proposer_name || '',
          target_communities: route.proposal?.target_communities || '',
          mobility_pain_points: route.proposal?.mobility_pain_points || '',
          key_landmarks: route.proposal?.key_landmarks || '',
          change_summary: 'ปรับปรุงจุดจอดและแนวเส้นทาง'
        });
        setActiveTab('studio');
        fitMapToRoute(route);
      };

      const handleSaveRouteFromStudio = statusToSave => {
        if (!studioForm.name.trim()) {
          showNotification('กรุณาระบุชื่อสายรถโดยสารก่อนบันทึก', 'error');
          return;
        }
        if (studioForm.stop_ids.length < 2) {
          showNotification('กรุณาเพิ่มจุดจอดอย่างน้อย 2 จุด (ต้นทาง และ ปลายทาง)', 'error');
          return;
        }
        if (!studioForm.target_communities.trim() || !studioForm.mobility_pain_points.trim()) {
          showNotification('กรุณาระบุพื้นที่/ชุมชน และสิ่งที่เส้นทางนี้ช่วยแก้ปัญหาให้ครบถ้วน', 'error');
          return;
        }

        const routeId = editingRouteId || `route-citizen-${Date.now()}`;
        const isRail = Boolean(SERVICE_TYPES[studioForm.service_type]?.supportsStationLevels);
        const hasUnderground = isRail && studioForm.stop_ids.some(sid => stopsMap[sid]?.station_level === 'underground');

        const existingRoute = routes.find(r => r.id === editingRouteId);
        const nowIso = new Date().toISOString();

        const newRouteObj = {
          id: routeId,
          code: studioForm.code.trim() || 'NEW',
          name: studioForm.name.trim(),
          color_hex: studioForm.color_hex,
          service_type: studioForm.service_type,
          operation_status: studioForm.operation_status || 'operating',
          updated_at: nowIso,
          geometry_type: studioForm.snap_to_road && studioForm.road_coordinates ? 'verified_road_network' : 'conceptual_user_drawn',
          verification_note: hasUnderground
            ? 'ระบบรถไฟฟ้า: สถานีลอยฟ้า/ระดับดินอิงตามแนวถนนจริง (OSRM) • สถานีใต้ดินเชื่อมตรงแบบอุโมงค์'
            : studioForm.snap_to_road && studioForm.road_coordinates
            ? 'คำนวณแนวเส้นทางวิ่งระดับดินตามถนนจริงด้วย OSRM (OpenStreetMap Road Network)'
            : 'เส้นแนวคิดที่ผู้ใช้วาดเชื่อมระหว่างจุดจอด',
          is_sample_data: false,
          is_admin_locked: isAdminMode ? Boolean(studioForm.is_admin_locked) : false,
          visible: true,
          stop_ids: [...studioForm.stop_ids],
          road_coordinates: studioForm.road_coordinates,
          segment_layers: isRail ? studioForm.segment_layers || [] : [],
          road_distance_meters: studioForm.road_distance_meters,
          proposal: {
            proposer_name: studioForm.proposer_name.trim() || 'ประชาชนผู้ร่วมออกแบบ',
            target_communities: studioForm.target_communities.trim(),
            mobility_pain_points: studioForm.mobility_pain_points.trim(),
            key_landmarks: studioForm.key_landmarks.trim(),
            status: statusToSave,
            likes_count: existingRoute ? (existingRoute.proposal?.likes_count ?? 1) : 1,
            dislikes_count: existingRoute ? (existingRoute.proposal?.dislikes_count ?? 0) : 0,
            created_at: existingRoute?.proposal?.created_at || nowIso,
            updated_at: nowIso
          }
        };

        setRoutes(prev => {
          const exists = prev.some(r => r.id === routeId);
          return exists ? prev.map(r => (r.id === routeId ? newRouteObj : r)) : [newRouteObj, ...prev];
        });

        setSelectedRouteId(routeId);
        setDirectoryRouteId(routeId);
        setActiveTab('detail');
        fitMapToRoute(newRouteObj);
        showNotification('บันทึกเส้นทางและอัปเดตวันเวลาแก้ไขล่าสุดเรียบร้อยแล้ว!', 'success');
      };

      const confirmDeleteRouteAction = () => {
        if (!deleteConfirmRoute) return;
        if (deleteConfirmRoute.is_admin_locked && !isAdminMode) {
          showNotification('🔒 ไม่สามารถลบเส้นทางหลักที่ถูกล็อกโดยแอดมินได้', 'error');
          setDeleteConfirmRoute(null);
          return;
        }
        const targetId = deleteConfirmRoute.id;
        setRoutes(prev => prev.filter(r => r.id !== targetId));
        setDeleteConfirmRoute(null);
        if (selectedRouteId === targetId) {
          const remaining = routes.filter(r => r.id !== targetId);
          setSelectedRouteId(remaining[0]?.id || '');
          setActiveTab('explore');
        }
        showNotification(`ลบเส้นทาง "${deleteConfirmRoute.name}" เรียบร้อยแล้ว`, 'info');
      };

      // ระบบโหวต 👍 ชอบเส้นทางนี้ (Like) และ 👎 ไม่ชอบเส้นทางนี้ (Dislike)
      const handleReactionVote = (routeId, voteType, e) => {
        if (e) e.stopPropagation();
        const previousVote = userVotesMap[routeId] || null;

        let likeDelta = 0;
        let dislikeDelta = 0;
        let nextVote = voteType;

        if (previousVote === voteType) {
          // กดซ้ำเพื่อยกเลิกโหวตเดิม
          nextVote = null;
          if (voteType === 'like') likeDelta = -1;
          if (voteType === 'dislike') dislikeDelta = -1;
        } else {
          if (voteType === 'like') {
            likeDelta = 1;
            if (previousVote === 'dislike') dislikeDelta = -1;
          } else if (voteType === 'dislike') {
            dislikeDelta = 1;
            if (previousVote === 'like') likeDelta = -1;
          }
        }

        setUserVotesMap(prev => {
          const copy = { ...prev };
          if (nextVote === null) delete copy[routeId];
          else copy[routeId] = nextVote;
          return copy;
        });

        setRoutes(prev =>
          prev.map(r => {
            if (r.id !== routeId) return r;
            const currentLikes = r.proposal?.likes_count ?? 0;
            const currentDislikes = r.proposal?.dislikes_count ?? 0;
            return {
              ...r,
              proposal: {
                ...r.proposal,
                likes_count: Math.max(0, currentLikes + likeDelta),
                dislikes_count: Math.max(0, currentDislikes + dislikeDelta)
              }
            };
          })
        );

        if (nextVote === 'like') {
          showNotification('👍 คุณกดถูกใจ (ชอบ) เส้นทางนี้แล้ว', 'success');
        } else if (nextVote === 'dislike') {
          showNotification('👎 คุณกดไม่ชอบเส้นทางนี้ — สามารถเขียนคอมเมนต์แนะนำจุดที่ควรปรับปรุงได้เลยครับ', 'info');
        }
      };

      // ระบบเพิ่มคอมเมนต์รายเส้นทาง
      const handleAddComment = (routeId, e) => {
        if (e) e.preventDefault();
        if (!commentText.trim()) {
          showNotification('กรุณาพิมพ์ความคิดเห็นหรือข้อเสนอแนะก่อนกดส่ง', 'error');
          return;
        }
        const newComment = {
          id: `cmt-${Date.now()}`,
          author: commentAuthor.trim() || 'พลเมืองเชียงใหม่',
          tag: commentTag,
          text: commentText.trim(),
          created_at: new Date().toISOString()
        };

        setCommentsMap(prev => ({
          ...prev,
          [routeId]: [newComment, ...(prev[routeId] || [])]
        }));
        setCommentText('');
        showNotification('💬 บันทึกความคิดเห็นของคุณในเส้นทางนี้เรียบร้อยแล้ว', 'success');
      };

      // ส่งออกข้อมูลเป็น GeoJSON และ CSV
      const exportRoutesToGeoJSON = targetRoutes => {
        const features = [];
        targetRoutes.forEach(route => {
          const stopObjs = (route.stop_ids || []).map(sid => stopsMap[sid]).filter(Boolean);
          const coords =
            Array.isArray(route.road_coordinates) && route.road_coordinates.length >= 2
              ? route.road_coordinates.map(pt => [pt[1], pt[0]])
              : stopObjs.map(s => [Number(s.longitude), Number(s.latitude)]);

          if (coords.length >= 2) {
            features.push({
              type: 'Feature',
              properties: {
                feature_type: 'transit_route',
                route_id: route.id,
                code: route.code,
                name: route.name,
                service_type: route.service_type,
                road_distance_meters: route.road_distance_meters,
                likes_count: route.proposal?.likes_count || 0,
                dislikes_count: route.proposal?.dislikes_count || 0
              },
              geometry: {
                type: 'LineString',
                coordinates: coords
              }
            });
          }

          stopObjs.forEach((st, idx) => {
            features.push({
              type: 'Feature',
              properties: {
                feature_type: 'transit_stop',
                route_code: route.code,
                sequence_order: idx + 1,
                stop_id: st.id,
                stop_code: st.code || '',
                stop_name: st.name,
                station_level: SERVICE_TYPES[route.service_type]?.supportsStationLevels ? st.station_level || 'at_grade' : 'surface',
                road_side: st.road_side || ''
              },
              geometry: {
                type: 'Point',
                coordinates: [Number(st.longitude), Number(st.latitude)]
              }
            });
          });
        });

        const geojson = { type: 'FeatureCollection', features };
        const blob = new Blob([JSON.stringify(geojson, null, 2)], { type: 'application/geo+json;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `chiangmai_next_transit_${Date.now()}.geojson`;
        a.click();
        URL.revokeObjectURL(url);
        showNotification('ดาวน์โหลดไฟล์ GeoJSON เรียบร้อยแล้ว', 'success');
      };

      const exportRoutesToCSV = targetRoutes => {
        const headers = [
          'route_code',
          'route_name',
          'service_type',
          'sequence_order',
          'stop_code',
          'stop_name',
          'station_level',
          'latitude',
          'longitude',
          'road_side',
          'likes_count',
          'dislikes_count'
        ];
        const rows = [headers.join(',')];

        targetRoutes.forEach(route => {
          const isRail = Boolean(SERVICE_TYPES[route.service_type]?.supportsStationLevels);
          const stopObjs = (route.stop_ids || []).map(sid => stopsMap[sid]).filter(Boolean);
          stopObjs.forEach((st, idx) => {
            const esc = val => `"${String(val ?? '').replace(/"/g, '""')}"`;
            rows.push(
              [
                esc(route.code),
                esc(route.name),
                esc(route.service_type),
                idx + 1,
                esc(st.code || ''),
                esc(st.name),
                esc(isRail ? st.station_level || 'at_grade' : 'surface'),
                Number(st.latitude).toFixed(5),
                Number(st.longitude).toFixed(5),
                esc(st.road_side || ''),
                route.proposal?.likes_count || 0,
                route.proposal?.dislikes_count || 0
              ].join(',')
            );
          });
        });

        const blob = new Blob(['\uFEFF' + rows.join('\n')], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `chiangmai_next_transit_${Date.now()}.csv`;
        a.click();
        URL.revokeObjectURL(url);
        showNotification('ดาวน์โหลดไฟล์ตาราง CSV เรียบร้อยแล้ว', 'success');
      };

      // ฟังก์ชันแยกบรรทัด CSV ที่รองรับเครื่องหมายอัญประกาศ (Quotes)
      const parseCsvLine = line => {
        const result = [];
        let current = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (ch === '"') {
            if (inQuotes && line[i + 1] === '"') {
              current += '"';
              i++;
            } else {
              inQuotes = !inQuotes;
            }
          } else if (ch === ',' && !inQuotes) {
            result.push(current.trim());
            current = '';
          } else {
            current += ch;
          }
        }
        result.push(current.trim());
        return result;
      };

      // ฟังก์ชันนำเข้าข้อมูลจากไฟล์ GeoJSON หรือ CSV
      const handleImportGeoJsonOrCsvFile = async event => {
        const file = event.target.files?.[0];
        if (!file) return;

        setIsImportingDataFile(true);
        try {
          const rawText = await file.text();
          const cleanText = rawText.replace(/^\uFEFF/, '').trim();
          const lowerName = file.name.toLowerCase();

          const newStopsBatch = {};
          const importedRoutesBatch = [];

          // 1. กรณีไฟล์ GeoJSON หรือ JSON
          if (lowerName.endsWith('.geojson') || lowerName.endsWith('.json') || cleanText.startsWith('{')) {
            const geojson = JSON.parse(cleanText);
            const features = Array.isArray(geojson.features)
              ? geojson.features
              : geojson.type === 'Feature'
              ? [geojson]
              : [];

            if (features.length === 0) {
              throw new Error('ไม่พบข้อมูล Feature ในไฟล์ GeoJSON นี้');
            }

            const routeFeatures = features.filter(
              f => f.geometry?.type === 'LineString' || f.geometry?.type === 'MultiLineString'
            );
            const pointFeatures = features.filter(f => f.geometry?.type === 'Point');

            const stopsByRouteCode = {};
            const standaloneStops = [];

            pointFeatures.forEach((pf, idx) => {
              const coords = pf.geometry?.coordinates;
              if (!Array.isArray(coords) || coords.length < 2) return;
              const lng = Number(coords[0]);
              const lat = Number(coords[1]);
              if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;

              const props = pf.properties || {};
              const stopId = props.stop_id || `stop-gio-${Date.now()}-${idx}`;
              const stopCode = props.stop_code || props.code || `G${idx + 1}`;
              const stopName = props.stop_name || props.name || `[${stopCode}] จุดจอดที่ ${idx + 1}`;
              const rawLevel = props.station_level;
              const stationLevel =
                rawLevel === 'elevated' || rawLevel === 'underground' ? rawLevel : 'at_grade';

              const stopObj = {
                id: stopId,
                code: String(stopCode),
                name: String(stopName),
                station_level: stationLevel,
                road_side: props.road_side || 'นำเข้าจากไฟล์ GeoJSON',
                latitude: Number(lat.toFixed(5)),
                longitude: Number(lng.toFixed(5)),
                sequence_order: Number(props.sequence_order || idx + 1)
              };

              newStopsBatch[stopId] = stopObj;

              const rCode = props.route_code || props.route_id || null;
              if (rCode) {
                if (!stopsByRouteCode[rCode]) stopsByRouteCode[rCode] = [];
                stopsByRouteCode[rCode].push(stopObj);
              } else {
                standaloneStops.push(stopObj);
              }
            });

            if (routeFeatures.length > 0) {
              for (let i = 0; i < routeFeatures.length; i++) {
                const rf = routeFeatures[i];
                const props = rf.properties || {};
                const rCode = props.code || props.route_code || `GJ-${i + 1}`;
                const rName = props.name || props.route_name || `เส้นทางนำเข้า GeoJSON (${rCode})`;
                const sType = SERVICE_TYPES[props.service_type] ? props.service_type : 'city_bus';
                const colorHex =
                  props.color_hex || ROUTE_COLORS[(routes.length + i) % ROUTE_COLORS.length].hex;

                let rawLineCoords = [];
                if (rf.geometry.type === 'LineString') {
                  rawLineCoords = rf.geometry.coordinates;
                } else if (rf.geometry.type === 'MultiLineString') {
                  rawLineCoords = rf.geometry.coordinates.flat();
                }

                const leafletCoords = rawLineCoords
                  .filter(pt => Array.isArray(pt) && pt.length >= 2)
                  .map(pt => [Number(pt[1]), Number(pt[0])]);

                let matchedStops = stopsByRouteCode[rCode] || stopsByRouteCode[props.route_id] || [];
                matchedStops.sort((a, b) => (a.sequence_order || 0) - (b.sequence_order || 0));

                // หากใน GeoJSON มีเฉพาะเส้น LineString แต่ไม่มี Point จุดจอด ให้สร้างป้ายต้นทาง-ปลายทางจากปลายเส้น
                if (matchedStops.length === 0 && leafletCoords.length >= 2) {
                  const startPt = leafletCoords[0];
                  const endPt = leafletCoords[leafletCoords.length - 1];
                  const sId1 = `stop-gio-line-${Date.now()}-${i}-start`;
                  const sId2 = `stop-gio-line-${Date.now()}-${i}-end`;

                  newStopsBatch[sId1] = {
                    id: sId1,
                    code: `${rCode}-1`,
                    name: `[${rCode}] จุดเริ่มต้นเส้นทาง`,
                    station_level: 'at_grade',
                    road_side: 'นำเข้าจากเส้นทาง GeoJSON',
                    latitude: Number(startPt[0].toFixed(5)),
                    longitude: Number(startPt[1].toFixed(5))
                  };
                  newStopsBatch[sId2] = {
                    id: sId2,
                    code: `${rCode}-2`,
                    name: `[${rCode}] จุดปลายทาง`,
                    station_level: 'at_grade',
                    road_side: 'นำเข้าจากเส้นทาง GeoJSON',
                    latitude: Number(endPt[0].toFixed(5)),
                    longitude: Number(endPt[1].toFixed(5))
                  };
                  matchedStops = [newStopsBatch[sId1], newStopsBatch[sId2]];
                }

                const stopIds = matchedStops.map(s => s.id);
                importedRoutesBatch.push({
                  id: `route-geojson-${Date.now()}-${i}`,
                  code: String(rCode),
                  name: String(rName),
                  color_hex: colorHex,
                  service_type: sType,
                  geometry_type: 'verified_road_network',
                  verification_note: `นำเข้าจากไฟล์ GeoJSON (${file.name})`,
                  is_sample_data: false,
                  is_admin_locked: false,
                  visible: true,
                  stop_ids: stopIds,
                  road_coordinates: leafletCoords.length >= 2 ? leafletCoords : null,
                  segment_layers: [],
                  road_distance_meters: props.road_distance_meters || null,
                  proposal: {
                    proposer_name: 'นำเข้าจากไฟล์ GeoJSON',
                    target_communities: props.target_communities || 'พื้นที่ตามข้อมูลพิกัด GeoJSON',
                    mobility_pain_points: props.mobility_pain_points || 'เส้นทางที่นำเข้าจากไฟล์ข้อมูลภูมิสารสนเทศ (GeoJSON)',
                    key_landmarks: '',
                    status: 'published',
                    likes_count: Number(props.likes_count || props.votes_count || 1),
                    dislikes_count: Number(props.dislikes_count || 0),
                    created_at: new Date().toISOString()
                  }
                });
              }
            } else {
              // กรณีไฟล์ GeoJSON มีเฉพาะจุด Point
              const groupKeys = Object.keys(stopsByRouteCode);
              if (groupKeys.length > 0) {
                for (let i = 0; i < groupKeys.length; i++) {
                  const rCode = groupKeys[i];
                  const stopList = stopsByRouteCode[rCode].sort(
                    (a, b) => (a.sequence_order || 0) - (b.sequence_order || 0)
                  );
                  if (stopList.length < 2) continue;

                  const osrmRes = await fetchOsrmRoadGeometry(stopList, 'main_corridor_only', false);
                  importedRoutesBatch.push({
                    id: `route-geojson-pts-${Date.now()}-${i}`,
                    code: String(rCode),
                    name: `สาย ${rCode} (นำเข้าจาก GeoJSON)`,
                    color_hex: ROUTE_COLORS[(routes.length + i) % ROUTE_COLORS.length].hex,
                    service_type: 'city_bus',
                    geometry_type: osrmRes.success ? 'verified_road_network' : 'conceptual_user_drawn',
                    verification_note: `นำเข้าจุดจอดจากไฟล์ GeoJSON (${file.name})`,
                    is_sample_data: false,
                    is_admin_locked: false,
                    visible: true,
                    stop_ids: stopList.map(s => s.id),
                    road_coordinates: osrmRes.coordinates || null,
                    segment_layers: osrmRes.segmentLayers || [],
                    road_distance_meters: osrmRes.distanceMeters || null,
                    proposal: {
                      proposer_name: 'นำเข้าจากไฟล์ GeoJSON',
                      target_communities: 'พื้นที่ตามจุดจอดที่นำเข้า',
                      mobility_pain_points: 'สร้างเส้นทางจากชุดพิกัดจุดจอด GeoJSON',
                      key_landmarks: '',
                      status: 'published',
                      likes_count: 1,
                      dislikes_count: 0,
                      created_at: new Date().toISOString()
                    }
                  });
                }
              } else if (standaloneStops.length >= 2) {
                const osrmRes = await fetchOsrmRoadGeometry(standaloneStops, 'main_corridor_only', false);
                importedRoutesBatch.push({
                  id: `route-geojson-single-${Date.now()}`,
                  code: `GJ-${routes.length + 1}`,
                  name: `สายนำเข้าจาก ${file.name.replace(/\.[^/.]+$/, '')}`,
                  color_hex: ROUTE_COLORS[routes.length % ROUTE_COLORS.length].hex,
                  service_type: 'city_bus',
                  geometry_type: osrmRes.success ? 'verified_road_network' : 'conceptual_user_drawn',
                  verification_note: `นำเข้าจุดจอดจากไฟล์ GeoJSON (${file.name})`,
                  is_sample_data: false,
                  is_admin_locked: false,
                  visible: true,
                  stop_ids: standaloneStops.map(s => s.id),
                  road_coordinates: osrmRes.coordinates || null,
                  segment_layers: osrmRes.segmentLayers || [],
                  road_distance_meters: osrmRes.distanceMeters || null,
                  proposal: {
                    proposer_name: 'นำเข้าจากไฟล์ GeoJSON',
                    target_communities: 'พื้นที่ตามจุดจอดที่นำเข้า',
                    mobility_pain_points: 'สร้างเส้นทางจากชุดพิกัดจุดจอด GeoJSON',
                    key_landmarks: '',
                    status: 'published',
                    likes_count: 1,
                    dislikes_count: 0,
                    created_at: new Date().toISOString()
                  }
                });
              }
            }
          } else {
            // 2. กรณีไฟล์ตาราง CSV
            const lines = cleanText.split(/\r?\n/).filter(l => l.trim().length > 0);
            if (lines.length < 2) {
              throw new Error('ไฟล์ CSV ต้องมีแถวหัวตาราง (Header) และข้อมูลอย่างน้อย 2 ป้าย');
            }

            const rawHeaders = parseCsvLine(lines[0]).map(h => h.toLowerCase().trim());
            const findCol = candidates => rawHeaders.findIndex(h => candidates.includes(h));

            const idxRouteCode = findCol(['route_code', 'code', 'line', 'รหัสสาย', 'สาย']);
            const idxRouteName = findCol(['route_name', 'line_name', 'ชื่อสาย', 'ชื่อเส้นทาง']);
            const idxServiceType = findCol(['service_type', 'type', 'ประเภทรถ']);
            const idxSeq = findCol(['sequence_order', 'seq', 'order', 'ลำดับ']);
            const idxStopCode = findCol(['stop_code', 'รหัสป้าย']);
            const idxStopName = findCol(['stop_name', 'name', 'th', 'ชื่อป้าย', 'ป้าย', 'สถานี']);
            const idxLevel = findCol(['station_level', 'level', 'ระดับสถานี']);
            const idxLat = findCol(['latitude', 'lat', 'ละติจูด', 'y']);
            const idxLng = findCol(['longitude', 'lng', 'lon', 'ลองจิจูด', 'x']);
            const idxRoadSide = findCol(['road_side', 'roadside', 'ฝั่งถนน', 'ตำแหน่งป้าย']);
            const idxCommunities = findCol(['target_communities', 'communities', 'พื้นที่', 'ชุมชน']);

            if (idxLat === -1 || idxLng === -1) {
              throw new Error('ไม่พบคอลัมน์พิกัด latitude (lat) และ longitude (lng) ในไฟล์ CSV');
            }

            const groupedRoutes = {};

            for (let r = 1; r < lines.length; r++) {
              const cols = parseCsvLine(lines[r]);
              if (cols.length <= Math.max(idxLat, idxLng)) continue;

              const lat = Number(cols[idxLat]);
              const lng = Number(cols[idxLng]);
              if (!Number.isFinite(lat) || !Number.isFinite(lng)) continue;

              const rCode = idxRouteCode !== -1 && cols[idxRouteCode] ? cols[idxRouteCode] : `CSV-${routes.length + 1}`;
              const rName =
                idxRouteName !== -1 && cols[idxRouteName]
                  ? cols[idxRouteName]
                  : `สาย ${rCode} (นำเข้าจาก CSV)`;
              const sTypeRaw = idxServiceType !== -1 ? cols[idxServiceType] : 'city_bus';
              const sType = SERVICE_TYPES[sTypeRaw] ? sTypeRaw : 'city_bus';
              const seqOrder = idxSeq !== -1 && Number.isFinite(Number(cols[idxSeq])) ? Number(cols[idxSeq]) : r;
              const stCode = idxStopCode !== -1 && cols[idxStopCode] ? cols[idxStopCode] : `C${r}`;
              const stName =
                idxStopName !== -1 && cols[idxStopName] ? cols[idxStopName] : `[${stCode}] ป้ายที่ ${r}`;
              const rawLevel = idxLevel !== -1 ? cols[idxLevel] : 'at_grade';
              const stLevel =
                rawLevel === 'elevated' || rawLevel === 'underground' ? rawLevel : 'at_grade';
              const roadSide =
                idxRoadSide !== -1 && cols[idxRoadSide] ? cols[idxRoadSide] : 'นำเข้าจากตาราง CSV';
              const communities =
                idxCommunities !== -1 && cols[idxCommunities] ? cols[idxCommunities] : 'พื้นที่ตามตารางป้าย CSV';

              const stopId = `stop-csv-${Date.now()}-${r}`;
              const stopObj = {
                id: stopId,
                code: stCode,
                name: stName.startsWith('[') ? stName : `[${stCode}] ${stName}`,
                station_level: stLevel,
                road_side: roadSide,
                latitude: Number(lat.toFixed(5)),
                longitude: Number(lng.toFixed(5)),
                sequence_order: seqOrder
              };

              newStopsBatch[stopId] = stopObj;

              if (!groupedRoutes[rCode]) {
                groupedRoutes[rCode] = {
                  code: rCode,
                  name: rName,
                  service_type: sType,
                  communities,
                  stops: []
                };
              }
              groupedRoutes[rCode].stops.push(stopObj);
            }

            const routeKeys = Object.keys(groupedRoutes);
            for (let i = 0; i < routeKeys.length; i++) {
              const grp = groupedRoutes[routeKeys[i]];
              grp.stops.sort((a, b) => (a.sequence_order || 0) - (b.sequence_order || 0));
              if (grp.stops.length < 2) continue;

              const isRail = Boolean(SERVICE_TYPES[grp.service_type]?.supportsStationLevels);
              const tier = SERVICE_TYPES[grp.service_type]?.tier || 'main_corridor_only';
              const osrmRes = await fetchOsrmRoadGeometry(grp.stops, tier, isRail);

              importedRoutesBatch.push({
                id: `route-csv-${Date.now()}-${i}`,
                code: grp.code,
                name: grp.name,
                color_hex: ROUTE_COLORS[(routes.length + i) % ROUTE_COLORS.length].hex,
                service_type: grp.service_type,
                geometry_type: osrmRes.success ? 'verified_road_network' : 'conceptual_user_drawn',
                verification_note: `นำเข้าจากไฟล์ CSV (${file.name}) พร้อมคำนวณแนวถนนจริงด้วย OSRM`,
                is_sample_data: false,
                is_admin_locked: false,
                visible: true,
                stop_ids: grp.stops.map(s => s.id),
                road_coordinates: osrmRes.coordinates || null,
                segment_layers: osrmRes.segmentLayers || [],
                road_distance_meters: osrmRes.distanceMeters || null,
                proposal: {
                  proposer_name: 'นำเข้าจากไฟล์ตาราง CSV',
                  target_communities: grp.communities,
                  mobility_pain_points: 'เส้นทางและจุดจอดที่นำเข้าจากไฟล์ตาราง CSV',
                  key_landmarks: grp.stops.slice(0, 4).map(s => s.name).join(', '),
                  status: 'published',
                  likes_count: 1,
                  dislikes_count: 0,
                  created_at: new Date().toISOString()
                }
              });
            }
          }

          if (importedRoutesBatch.length === 0) {
            throw new Error('ไม่สามารถสร้างเส้นทางได้ (ต้องมีจุดจอดที่มีพิกัดถูกต้องอย่างน้อย 2 จุดต่อสาย)');
          }

          setStopsMap(prev => ({ ...prev, ...newStopsBatch }));
          setRoutes(prev => [...importedRoutesBatch, ...prev]);
          setSelectedRouteId(importedRoutesBatch[0].id);
          setDirectoryRouteId(importedRoutesBatch[0].id);
          setIsDataImportModalOpen(false);
          setActiveTab('detail');
          setTimeout(() => fitMapToRoute(importedRoutesBatch[0]), 200);

          showNotification(
            `📂 นำเข้าสำเร็จ ${importedRoutesBatch.length} เส้นทาง (${Object.keys(newStopsBatch).length} จุดจอด) จากไฟล์ "${file.name}"`,
            'success'
          );
        } catch (err) {
          showNotification(`❌ นำเข้าไฟล์ไม่สำเร็จ: ${err.message || 'รูปแบบไฟล์ไม่ถูกต้อง'}`, 'error');
        } finally {
          setIsImportingDataFile(false);
          if (event.target) event.target.value = '';
        }
      };

      const openShareModalForRoute = route => {
        if (!route) return;
        const routeStops = (route.stop_ids || []).map(sid => stopsMap[sid]).filter(Boolean);
        const payload = {
          r: {
            code: route.code,
            name: route.name,
            color_hex: route.color_hex,
            service_type: route.service_type,
            proposal: route.proposal
          },
          s: routeStops.map(st => ({
            id: st.id,
            code: st.code,
            name: st.name,
            station_level: st.station_level || 'at_grade',
            latitude: st.latitude,
            longitude: st.longitude
          }))
        };
        const code = encodeSharePayload(payload);
        const shareUrl = `${window.location.origin}${window.location.pathname}?proposal=${code}`;
        setShareModalData({ route, code, shareUrl });
      };

      const selectedRoute = useMemo(
        () => routes.find(r => r.id === selectedRouteId) || routes[0] || null,
        [routes, selectedRouteId]
      );

      const directoryRoute = useMemo(
        () => routes.find(r => r.id === directoryRouteId) || routes[0] || null,
        [routes, directoryRouteId]
      );

      const statusCounts = useMemo(() => {
        const counts = { operating: 0, future_project: 0, suggested_route: 0 };
        routes.forEach(r => {
          const st = r.operation_status || 'operating';
          counts[st] = (counts[st] || 0) + 1;
        });
        return counts;
      }, [routes]);

      const filteredRoutes = useMemo(() => {
        return routes.filter(r => {
          const statusKey = r.operation_status || 'operating';
          if (!enabledOperationStatuses[statusKey]) return false;
          if (!searchQuery.trim()) return true;
          const q = searchQuery.toLowerCase();
          const matchRoute =
            r.name.toLowerCase().includes(q) ||
            r.code.toLowerCase().includes(q) ||
            (r.proposal?.target_communities || '').toLowerCase().includes(q);
          const matchStops = (r.stop_ids || []).some(sid =>
            (stopsMap[sid]?.name || '').toLowerCase().includes(q)
          );
          return matchRoute || matchStops;
        });
      }, [routes, stopsMap, searchQuery, enabledOperationStatuses]);

      const isStudioRailMode = Boolean(SERVICE_TYPES[studioForm.service_type]?.supportsStationLevels);

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 text-slate-900">
          {/* แถบเมนูหลักด้านบน ดีไซน์สะอาดตา ทันสมัย */}
          <header className="bg-slate-900 text-white shadow-md sticky top-0 z-30 border-b border-slate-800">
            <div className="max-w-[1600px] mx-auto px-3 sm:px-5 py-2.5 flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-3">
                {/* โลโก้ Chiangmai NEXT แทนอีโมจิเดิม */}
                <div className="w-11 h-11 rounded-xl bg-gradient-to-br from-blue-600 to-indigo-800 flex flex-col items-center justify-center font-bold text-white shadow-lg border border-blue-400">
                  <span className="text-[14px] leading-none tracking-wider">CM</span>
                  <span className="text-[8px] leading-none text-blue-200 mt-0.5">NEXT</span>
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="font-bold text-base sm:text-lg tracking-tight text-white flex items-center">
                      Chiangmai NEXT Transit Lab 
                      <span className="text-[11px] font-medium text-blue-300 ml-2 bg-blue-900/50 px-1.5 py-0.5 rounded">v1.0.0-beta</span>
                    </h1>
                  </div>
                  <p className="text-[11px] text-slate-300 hidden sm:block">
                    ระบบร่วมออกแบบเส้นทางขนส่งมวลชนและค้นหาจุดเชื่อมต่อเชียงใหม่
                  </p>
                </div>
              </div>

              {/* ปุ่มสลับหน้าจอหลัก 5 โหมดที่เข้าใจง่าย */}
              <div className="flex flex-wrap items-center gap-1.5">
                <button
                  onClick={() => setActiveTab('explore')}
                  className={`px-3 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 ${
                    activeTab === 'explore'
                      ? 'bg-white text-slate-900 shadow-sm'
                      : 'bg-slate-800 text-slate-200 hover:bg-slate-700'
                  }`}
                >
                  <span>🗺️ แผนที่รวม</span>
                  <span className="px-1.5 py-0.2 rounded-full text-[10px] bg-blue-600 text-white">
                    {routes.length}
                  </span>
                </button>

                <button
                  onClick={() => setActiveTab('trip_planner')}
                  className={`px-3 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 ${
                    activeTab === 'trip_planner'
                      ? 'bg-amber-400 text-slate-950 shadow-sm'
                      : 'bg-amber-500/20 text-amber-300 border border-amber-400/30 hover:bg-amber-500/30'
                  }`}
                >
                  <span>🧭 ค้นหาการเดินทาง (ต่อรถ/เดินเท้า)</span>
                </button>

                <button
                  onClick={() => startCreateNewRoute('city_bus')}
                  className={`px-3 py-2 rounded-xl text-xs font-bold transition ${
                    activeTab === 'studio'
                      ? 'bg-amber-400 text-slate-950 shadow-sm'
                      : 'bg-blue-600 text-white hover:bg-blue-500'
                  }`}
                >
                  ✏️ + ออกแบบสายรถ
                </button>

                <button
                  onClick={() => setActiveTab('detail')}
                  className={`px-3 py-2 rounded-xl text-xs font-bold transition ${
                    activeTab === 'detail'
                      ? 'bg-white text-slate-900 shadow-sm'

                >
                  💬 รายละเอียด & คอมเมนต์
                </button>

                <button

                  🚏 ตารางป้าย ({routes.length} สาย)

                <button

                <button

                  }`}
                  title="สลับโหมดแอดมินเพื่อล็อกหรือปลดล็อกเส้นทางหลัก"
                >
                  {isAdminMode ? '🛡️ แอดมิน' : '👤 ผู้ใช้ทั่วไป'}
                </button>
              </div>
            </div>
          </header>

          {/* แถบข้อมูลย่อและปุ่มนำเข้า/ส่งออกไฟล์ GeoJSON & CSV */}
          <div className="bg-slate-800 text-slate-200 text-xs px-4 py-1.5 border-b border-slate-700 flex flex-wrap items-center justify-between gap-2">
            <div className="flex items-center gap-2">
              <span className="inline-block w-2 h-2 rounded-full bg-emerald-400"></span>
              <span>
                <b>การใช้งาน:</b> รถทั่วไปวิ่งระดับดินตามถนนจริง • เฉพาะ <b>รถไฟฟ้า (🚝)</b> เท่านั้นที่เลือกสถานีลอยฟ้า/ระดับดิน/ใต้ดินได้
              </span>
            </div>
            <div className="flex flex-wrap items-center gap-3">
              {isAdminMode && (
                <>
                  <button
                    onClick={() => setIsDataImportModalOpen(true)}
                    className="bg-indigo-600 hover:bg-indigo-500 text-white px-2.5 py-1 rounded-lg font-bold transition shadow-sm flex items-center gap-1"
                  >
                    📂 นำเข้า GeoJSON / CSV
                  </button>
                  <span className="text-slate-600">|</span>
                  <button
                    onClick={() => exportRoutesToGeoJSON(routes)}
                    className="text-blue-300 hover:text-white font-semibold transition"
                  >
                    📥 ส่งออก GeoJSON
                  </button>
                  <span className="text-slate-600">|</span>
                  <button
                    onClick={() => exportRoutesToCSV(routes)}
                    className="text-emerald-300 hover:text-white font-semibold transition"
                  >
                    📊 ส่งออก CSV
                  </button>
                </>
              )}
            </div>
          </div>

          {/* พื้นที่ทำงานหลัก: ซ้ายแผงควบคุม + ขวาแผนที่จังหวัดเชียงใหม่ */}
          <div className="flex-1 flex flex-col lg:flex-row overflow-hidden">
            {}
            <aside className="w-full lg:w-[480px] xl:w-[520px] bg-white border-r border-slate-200 flex flex-col max-h-[56vh] lg:max-h-[calc(100vh-92px)] overflow-hidden shadow-sm">
              {/* แท็บ 1: สำรวจเส้นทางทั้งหมด */}
              {activeTab === 'explore' && (
                <div className="flex-1 flex flex-col overflow-hidden">
                  <div className="p-4 border-b border-slate-200 space-y-3 bg-slate-50/80">
                    <div className="flex items-center gap-2">
                      <div className="relative flex-1">
                        <input
                          type="text"
                          value={searchQuery}

                          className="w-full text-xs sm:text-sm border border-slate-300 rounded-xl pl-3 pr-8 py-2.5 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                        />
                        {searchQuery && (

                      </div>
                      <button
                        onClick={() => startCreateNewRoute('city_bus')}
                        className="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-3.5 py-2.5 rounded-xl shadow-sm whitespace-nowrap transition"
                      >
                        + เพิ่มสายใหม่
                      </button>
                    </div>

                    {/* ตัวเลือกกรองการแสดงผลตามสถานะเส้นทาง (เปิดให้บริการ / โครงการในอนาคต / เส้นทางเสนอแนะ) */}
                    <div className="bg-white p-2.5 rounded-xl border border-slate-200 space-y-2 shadow-sm">
                      <div className="flex items-center justify-between text-[11px]">
                        <span className="font-bold text-slate-700">👁️ เลือกแสดงผลประเภทเส้นทางบนแผนที่:</span>
                        <div className="flex items-center gap-2">

                      <div className="grid grid-cols-3 gap-1.5">

                                }))
                              }
                              className={`py-1.5 px-2 rounded-xl text-[11px] font-bold border transition flex items-center justify-between gap-1 ${
                                isChecked
                                  ? `${op.badgeClass} shadow-sm ring-1 ring-slate-900/10`
                                  : 'bg-slate-50 text-slate-400 border-slate-200 opacity-65 hover:opacity-100'

                            >
                              <span className="truncate">{op.label}</span>

                                }`}
                              >
                                {count}
                              </span>
                            </button>
                          );
                        })}
                      </div>
                    </div>

                    <div className="flex flex-wrap items-center justify-between gap-2 text-xs text-slate-600">
                      <label className="flex items-center gap-1.5 cursor-pointer select-none">
                        <input

                        />
                        <span className="font-semibold text-blue-900">➤ แสดงลูกศรทิศทางเดินรถ</span>
                      </label>
                      <label className="flex items-center gap-1.5 cursor-pointer select-none">

                        </button>

                </div>
              )}

              {/* คำอธิบายสัญลักษณ์บนแผนที่ (Map Legend) */}
              <div className="absolute bottom-4 left-3 z-20 bg-white/95 backdrop-blur border border-slate-300 rounded-2xl p-3 shadow-lg max-w-xs text-xs space-y-1.5">
                <div className="font-bold text-slate-900">สัญลักษณ์เส้นทางบนแผนที่</div>
                <div className="flex items-center gap-2">
                  <span className="w-6 h-1.5 bg-emerald-600 rounded inline-block"></span>
                  <span>เส้นทึบ: วิ่งตามแนวถนนจริง (รถเมล์ / รถแดง / LRT)</span>
                </div>
                <div className="flex items-center gap-2">
                  <span className="w-4 h-4 rounded-full bg-blue-600 text-white text-[9px] font-bold flex items-center justify-center border border-white shadow">▲</span>
                  <span>ลูกศรบนเส้นทาง: ทิศทางที่รถมุ่งหน้าไป</span>
                </div>
                <div className="flex items-center gap-2">
                  <span className="w-6 border-b-2 border-dashed border-purple-700 inline-block"></span>
                  <span>เส้นประสีม่วง: อุโมงค์รถไฟฟ้าใต้ดิน (เฉพาะ LRT)</span>
                </div>
                <div className="flex items-center gap-2">
                  <span className="w-3.5 h-3.5 rounded-full bg-amber-500 border-2 border-white shadow inline-block"></span>
                  <span>จุดเชื่อมต่อเปลี่ยนสายรถ (ระยะเดิน ≤ 150 ม.)</span>
                </div>
              </div>
            </main>
          </div>

          {}
          {toast && (
            <div className="fixed bottom-5 right-5 z-50 bg-slate-900 text-white px-4 py-3 rounded-2xl shadow-xl border border-slate-700 text-xs sm:text-sm font-semibold flex items-center gap-2.5">
              <span>{toast.message}</span>
              <button onClick={() => setToast(null)} className="text-slate-400 hover:text-white ml-2">
                ✕
              </button>
            </div>
          )}

          {/* หน้าต่างยืนยันการลบสายรถ */}
          {deleteConfirmRoute && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-5 shadow-2xl space-y-3">
                <h3 className="font-bold text-base text-slate-900">ยืนยันการลบเส้นทาง</h3>
                <p className="text-xs text-slate-600">
                  คุณต้องการลบเส้นทาง <b>{deleteConfirmRoute.name}</b> ออกจากระบบใช่หรือไม่?
                </p>
                <div className="flex justify-end gap-2 pt-2">
                  <button
                    onClick={() => setDeleteConfirmRoute(null)}
                    className="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700"
                  >
                    ยกเลิก
                  </button>
                  <button
                    onClick={confirmDeleteRouteAction}
                    className="px-4 py-2 rounded-xl text-xs font-bold bg-rose-600 text-white hover:bg-rose-700"
                  >
                    🗑️ ยืนยันลบเส้นทาง
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* หน้าต่างแชร์ลิงก์ข้อเสนอ */}
          {shareModalData && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full p-5 shadow-2xl space-y-3">
                <div className="flex items-center justify-between">
                  <h3 className="font-bold text-base text-slate-900">
                    🔗 แชร์ข้อเสนอเส้นทาง: {shareModalData.route.code}
                  </h3>
                  <button
                    onClick={() => setShareModalData(null)}
                    className="text-slate-400 hover:text-slate-700"
                  >
                    ✕
                  </button>
                </div>
                <p className="text-xs text-slate-600">
                  คัดลอกลิงก์ด้านล่างเพื่อส่งต่อข้อมูลเส้นทางและจุดจอดชุดนี้:
                </p>
                <textarea
                  readOnly
                  rows={3}
                  value={shareModalData.shareUrl}
                  className="w-full text-xs bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-mono"
                />
                <div className="flex justify-end gap-2">
                  <button
                    onClick={() => {
                      const el = document.createElement('textarea');
                      el.value = shareModalData.shareUrl;
                      document.body.appendChild(el);
                      el.select();
                      document.execCommand('copy');
                      document.body.removeChild(el);
                      showNotification('คัดลอกลิงก์แชร์ลงคลิปบอร์ดเรียบร้อยแล้ว', 'success');
                    }}
                    className="px-4 py-2 rounded-xl text-xs font-bold bg-blue-600 text-white hover:bg-blue-700"
                  >
                    📋 คัดลอกลิงก์แชร์
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* หน้าต่างนำเข้าไฟล์ข้อมูล GeoJSON และ CSV */}
          {isDataImportModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full p-5 shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b border-slate-200 pb-3">
                  <div>
                    <h3 className="font-bold text-base text-slate-900 flex items-center gap-2">
                      <span>📂 นำเข้าข้อมูลเส้นทางและป้ายจอด (GeoJSON / CSV)</span>
                    </h3>
                    <p className="text-xs text-slate-500 mt-0.5">
                      รองรับไฟล์ที่ส่งออกจากระบบนี้ หรือไฟล์พิกัดมาตรฐานจากโปรแกรม GIS / Excel
                    </p>
                  </div>
                  <button
                    onClick={() => setIsDataImportModalOpen(false)}
                    className="text-slate-400 hover:text-slate-700 text-lg font-bold"
                  >
                    ✕
                  </button>
                </div>

                <div className="p-5 border-2 border-dashed border-indigo-300 rounded-2xl bg-indigo-50/50 text-center space-y-3">
                  <div className="text-xs font-semibold text-indigo-950">
                    เลือกไฟล์ <code className="bg-white px-1.5 py-0.5 rounded border">.geojson</code>,{' '}
                    <code className="bg-white px-1.5 py-0.5 rounded border">.json</code> หรือ{' '}
                    <code className="bg-white px-1.5 py-0.5 rounded border">.csv</code> จากเครื่องของคุณ
                  </div>
                  <input
                    type="file"
                    accept=".geojson,.json,.csv,application/geo+json,application/json,text/csv"
                    onChange={handleImportGeoJsonOrCsvFile}
                    disabled={isImportingDataFile}
                    className="block w-full text-xs text-slate-600 file:mr-3 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-indigo-600 file:text-white hover:file:bg-indigo-700 cursor-pointer"
                  />
                  {isImportingDataFile && (
                    <div className="text-xs font-bold text-indigo-700 animate-pulse">
                      ⏳ กำลังอ่านพิกัดและคำนวณแนวเส้นทางตามถนนจริง...
                    </div>
                  )}
                </div>

                <div className="bg-slate-50 p-3.5 rounded-xl border border-slate-200 text-xs text-slate-600 space-y-1.5">
                  <div className="font-bold text-slate-800">💡 รูปแบบไฟล์ที่รองรับอัตโนมัติ:</div>
                  <div>
                    • <b>ไฟล์ GeoJSON (.geojson / .json):</b> รองรับทั้งเส้นทาง (LineString) และจุดจอด (Point)
                  </div>
                  <div>
                    • <b>ไฟล์ตาราง CSV (.csv):</b> ต้องมีคอลัมน์พิกัด <code className="text-slate-900 font-semibold">latitude</code> (หรือ <code className="text-slate-900 font-semibold">lat</code>) และ <code className="text-slate-900 font-semibold">longitude</code> (หรือ <code className="text-slate-900 font-semibold">lng</code>) พร้อมชื่อป้าย <code className="text-slate-900 font-semibold">stop_name</code> และรหัสสาย <code className="text-slate-900 font-semibold">route_code</code>
                  </div>
                </div>

                <div className="flex justify-end">
                  <button
                    onClick={() => setIsDataImportModalOpen(false)}
                    className="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700"
                  >
                    ปิดหน้าต่าง
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* หน้าต่าง "เกี่ยวกับเรา" (About Us Modal) */}
          {isAboutModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/70 flex items-center justify-center p-4 backdrop-blur-sm">
              <div className="bg-white rounded-2xl max-w-2xl w-full p-6 sm:p-8 shadow-2xl space-y-5 relative">
                <button
                  onClick={() => setIsAboutModalOpen(false)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-slate-700 w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 transition"
                >
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>

                <div className="flex items-center gap-4 border-b border-slate-100 pb-4">
                  <div className="w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-600 to-indigo-800 flex flex-col items-center justify-center font-bold text-white shadow-lg border-2 border-blue-200">
                    <span className="text-[20px] leading-none tracking-wider">CM</span>
                    <span className="text-[10px] leading-none text-blue-200 mt-1">NEXT</span>
                  </div>
                  <div>
                    <h2 className="text-xl sm:text-2xl font-bold text-slate-900">Chiangmai NEXT Transit Lab</h2>
                    <p className="text-sm font-semibold text-blue-600">แพลตฟอร์มทดลองและร่วมออกแบบโครงข่ายระบบขนส่งมวลชนเชียงใหม่</p>
                  </div>
                </div>

                <div className="space-y-4 text-sm text-slate-700 leading-relaxed">
                  <p>
                    <b>Chiangmai NEXT Transit Lab</b> คือพื้นที่ดิจิทัล (Digital Sandbox) ที่เปิดให้ภาคประชาชน ชุมชน นักวิชาการ และหน่วยงานที่เกี่ยวข้อง ได้มีส่วนร่วมในการจำลอง วาดเส้นทาง เสนอแนะจุดรับส่ง และแสดงความคิดเห็น เพื่อนำไปสู่การพัฒนาแผนแม่บทระบบขนส่งสาธารณะที่สามารถตอบโจทย์การเดินทางของคนเชียงใหม่อย่างแท้จริง
                  </p>

                  <div className="bg-blue-50 p-4 rounded-xl border border-blue-100">
                    <h3 className="font-bold text-blue-900 mb-2">💡 เราสร้างระบบนี้ขึ้นมาเพื่ออะไร?</h3>
                    <ul className="list-disc list-inside space-y-1.5 text-blue-800">
                      <li><b>เปิดพื้นที่การมีส่วนร่วม:</b> ให้คนเชียงใหม่ได้ร่างเส้นทางที่อยากให้มีผ่านหน้าบ้านหรือชุมชนของตนเองได้ง่ายๆ บนแผนที่จริง</li>
                      <li><b>เครื่องมือช่วยจำลองเส้นทาง (Spatial AI):</b> นำเทคโนโลยี OSRM (OpenStreetMap Routing) และระบบ AI ช่วยจัดระเบียบข้อมูลและประเมินประสิทธิภาพป้ายหยุดรถแบบอัตโนมัติ</li>
                      <li><b>รับฟังความคิดเห็นเพื่อส่งต่อ:</b> รวบรวมสถิติความต้องการ (การกดเห็นด้วย / ไม่เห็นด้วย) และข้อเสนอแนะต่างๆ ไว้ในฐานข้อมูล เพื่อเป็นเสียงสะท้อนให้กับการพัฒนาระบบรถไฟฟ้า (LRT) และรถเมล์ไฟฟ้าเชียงใหม่ในอนาคต</li>
                    </ul>
                  </div>

                  <p className="text-xs text-slate-500 text-center pt-2">
                    พัฒนาและออกแบบโดย <b>Chiangmai NEXT</b> • เวอร์ชัน 1.0.0-beta
                  </p>
                </div>

                <div className="pt-2">
                  <button
                    onClick={() => setIsAboutModalOpen(false)}
                    className="w-full py-3 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-sm transition shadow-md"
                  >
                    เข้าใจแล้ว, เริ่มใช้งานกันเลย!
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    class AppErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, errorMessage: '' };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, errorMessage: error?.message || 'เกิดข้อผิดพลาดที่ไม่ทราบสาเหตุ' };
      }
      handleHardReset = () => {
        try {
          Object.values(STORAGE_KEYS).forEach(k => localStorage.removeItem(k));
        } catch {}
        window.location.reload();
      };
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-slate-900 text-white flex items-center justify-center p-6">
              <div className="max-w-md w-full bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-2xl space-y-4">
                <h2 className="text-lg font-bold text-amber-400">⚠️ ระบบตรวจพบข้อมูลแคชผิดรูปแบบ</h2>
                <p className="text-xs text-slate-300">{this.state.errorMessage}</p>
                <button
                  onClick={this.handleHardReset}
                  className="w-full bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold py-2.5 px-4 rounded-xl"
                >
                  🧹 ล้างแคชและรีเซ็ตค่าเริ่มต้น
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <AppErrorBoundary>
        <App />
      </AppErrorBoundary>
    );
  </script>
</body>
</html>
