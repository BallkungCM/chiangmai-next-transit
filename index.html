      const [isAiThinking, setIsAiThinking] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const showNotification = (message, type = 'info') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 4000);
      };

      // ----------------------------------------------------
      // พระเอกของเรา: ระบบซิงค์ข้อมูลกับ Firebase
      // ----------------------------------------------------
      useEffect(() => {
        // เมื่อเปิดเว็บ จะเช็คว่าในฐานข้อมูลมีข้อมูลหรือยัง ถ้ายังให้เอา INITIAL_ROUTES ไปใส่
        const initFirebase = async () => {
          try {
            const routesSnap = await db.collection('routes').get();
            if (routesSnap.empty) {
              INITIAL_ROUTES.forEach(r => db.collection('routes').doc(r.id).set(r));
              Object.values(INITIAL_STOPS).forEach(s => db.collection('stops').doc(s.id).set(s));
            }
          } catch(e) { console.log("รอเชื่อมต่อ Firebase..."); }
        };
        initFirebase();

        // เปิดรับฟังข้อมูลอัปเดตแบบ Real-time!
        const unsubRoutes = db.collection('routes').onSnapshot(snapshot => {
          if (!snapshot.empty) {
            setRoutes(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
          }
        });

        const unsubStops = db.collection('stops').onSnapshot(snapshot => {
          if (!snapshot.empty) {
            const loadedStops = {};
            snapshot.docs.forEach(doc => { loadedStops[doc.id] = doc.data(); });
            setStopsMap(loadedStops);
          }
        });

        const unsubComments = db.collection('comments').onSnapshot(snapshot => {
            if(!snapshot.empty) {
                const cmts = {};
                snapshot.docs.forEach(doc => {
                    const data = doc.data();
                    if(!cmts[data.routeId]) cmts[data.routeId] = [];
                    cmts[data.routeId].push(data);
                });
                setCommentsMap(cmts);
            }
        });

        return () => { unsubRoutes(); unsubStops(); unsubComments(); };
      }, []);

        const newRouteObj = {

          // ใส่ข้อมูลจากฟอร์ม studioForm ลงไป (เหมือนโค้ดเดิม)
          updated_at: new Date().toISOString()
        };

        try {
          // 1. บันทึกเส้นทางลง Firebase
          await db.collection('routes').doc(newRouteObj.id).set(newRouteObj);
          
          // 2. บันทึกจุดจอดใหม่ๆ ลง Firebase
          const currentStops = stopsMap; // หรือดึงจาก Ref
          newRouteObj.stop_ids.forEach(async (sid) => {
            if(currentStops[sid]) {
              await db.collection('stops').doc(sid).set(currentStops[sid]);
            }
          });

          showNotification('บันทึกเส้นทางขึ้นระบบออนไลน์สำเร็จ! ทุกคนจะเห็นอัปเดตนี้ทันที', 'success');

        } catch(error) {
