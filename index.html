    // แปลงวันเวลาที่แก้ไขล่าสุดให้อ่านง่ายในภาษาไทย
    function formatThaiDateTime(isoString) {
      if (!isoString) return 'ไม่ระบุเวลา';
      try {
        const d = new Date(isoString);
        if (isNaN(d.getTime())) return 'ไม่ระบุเวลา';
        return d.toLocaleString('th-TH', {
          day: 'numeric',
          month: 'short',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        }) + ' น.';
      } catch {
        return 'ไม่ระบุเวลา';
      }
    }

    // ตัดพิกัดเส้นทางตามแนวถนนจริง (road_coordinates) เฉพาะช่วงระหว่างป้ายขึ้นรถ ถึง ป้ายลงรถ
    function extractRouteSubpathOnRoad(routeObj, passStops) {
      if (!Array.isArray(passStops) || passStops.length < 2) return [];
      const boardStop = passStops[0];
      const alightStop = passStops[passStops.length - 1];
      const roadCoords = routeObj?.road_coordinates;

      if (!Array.isArray(roadCoords) || roadCoords.length < 2) {
        return passStops.map(st => [Number(st.latitude), Number(st.longitude)]);
      }

      const bLat = Number(boardStop.latitude);
      const bLng = Number(boardStop.longitude);
      const aLat = Number(alightStop.latitude);
      const aLng = Number(alightStop.longitude);

      let startIdx = 0;
      let minStartDist = Infinity;
      for (let i = 0; i < roadCoords.length; i++) {
        const d = calculateHaversineMeters(bLat, bLng, roadCoords[i][0], roadCoords[i][1]);
        if (d < minStartDist) {
          minStartDist = d;
          startIdx = i;
        }
      }

      // ค้นหาจุดลงรถโดยเริ่มไล่จากลำดับถัดจากจุดขึ้นรถไปตามทิศทางการวิ่งของสาย
      let endIdx = startIdx;
      let minEndDist = Infinity;
      for (let i = startIdx; i < roadCoords.length; i++) {
        const d = calculateHaversineMeters(aLat, aLng, roadCoords[i][0], roadCoords[i][1]);
        if (d < minEndDist) {
          minEndDist = d;
          endIdx = i;
        }
      }

      if (endIdx > startIdx) {
        return roadCoords.slice(startIdx, endIdx + 1);
      }
      return passStops.map(st => [Number(st.latitude), Number(st.longitude)]);
    }

    // ฟังก์ชันหาสีที่ยังไม่ถูกใช้งานอัตโนมัติ
    function getAvailableRouteColor(currentRoutes, isLrt) {
      const usedHexes = currentRoutes.map(r => String(r.color_hex).toUpperCase());
      
      if (isLrt && !usedHexes.includes('#BE123C')) {
        return '#BE123C'; // ให้สิทธิ์สีแดงทับทิมกับ LRT ก่อนถ้าว่าง
      }

      const unusedColors = ROUTE_COLORS.filter(c => !usedHexes.includes(c.hex.toUpperCase()));
      if (unusedColors.length > 0) {
        return unusedColors[0].hex;
      }
      return ROUTE_COLORS[Math.floor(Math.random() * ROUTE_COLORS.length)].hex;
    }

    // พิกัดสถานที่สำคัญยอดนิยมในเชียงใหม่ (รวมพื้นที่นอกเส้นทางหลัก เช่น หลัง มช., เซ็นทรัลเชียงใหม่ ฯลฯ)

      { id: 'pl-cmru', name: 'ม.ราชภัฏเชียงใหม่ / กาดธานินทร์', keywords: 'ราชภัฏ กาดธานินทร์ ตลาดศิริวัฒนา', lat: 18.80760, lng: 98.98660 },
      { id: 'pl-gov', name: 'ศูนย์ราชการจังหวัดเชียงใหม่ / สวน อบจ.', keywords: 'ศูนย์ราชการ สวนอบจ อบจ', lat: 18.83780, lng: 98.97350 },
      { id: 'pl-nakornping', name: 'โรงพยาบาลนครพิงค์', keywords: 'นครพิงค์ รพ.นครพิงค์ แม่ริม', lat: 18.85420, lng: 98.96850 },

      { id: 'pl-maejo', name: 'มหาวิทยาลัยแม่โจ้', keywords: 'แม่โจ้ ม.แม่โจ้ สันทราย', lat: 18.89820, lng: 99.01280 }
    ];

    function estimateWalkMinutes(meters) {
      return Math.max(1, Math.round(meters / 75)); // ความเร็วเดินเท้าเฉลี่ย ~4.5 กม./ชม. (75 เมตร/นาที)
    }

    // อัลกอริทึมค้นหาเส้นทางขนส่งมวลชน + เดินเท้า (รองรับ: เดินล้วน, ต่อเดียว 1 สาย, และเปลี่ยนสาย 1 ครั้ง)
    function computeTransitItineraries(originPt, destPt, activeRoutes, stopsMap) {
      if (!originPt || !destPt) return [];
      const results = [];
      const directWalkMeters = calculateHaversineMeters(originPt.lat, originPt.lng, destPt.lat, destPt.lng);

      // เตรียมรายการป้ายของแต่ละสายที่เปิดใช้งาน
      const routeStopLists = activeRoutes
        .map(r => {
          const stops = (r.stop_ids || [])
            .map((sid, idx) => {
              const st = stopsMap[sid];
              return st ? { ...st, seqIndex: idx } : null;
            })
            .filter(Boolean);
          return { route: r, stops };
        })
        .filter(item => item.stops.length >= 2);

      // 1. ค้นหาการเดินทางแบบไม่ต้องเปลี่ยนสาย (1 สายรวด: เดิน -> ขึ้นรถสายเดียว -> เดินถึงปลายทาง)
      routeStopLists.forEach(({ route, stops }) => {
        let bestSingleForRoute = null;

        for (let i = 0; i < stops.length - 1; i++) {
          const boardStop = stops[i];
          const walkToBoard = calculateHaversineMeters(originPt.lat, originPt.lng, boardStop.latitude, boardStop.longitude);
          if (walkToBoard > 4500) continue; // จำกัดรัศมีเดินเข้าป้ายไม่เกิน 4.5 กม.

          for (let j = i + 1; j < stops.length; j++) {
            const alightStop = stops[j];
            const walkFromAlight = calculateHaversineMeters(alightStop.latitude, alightStop.longitude, destPt.lat, destPt.lng);
            if (walkFromAlight > 4500) continue;

            const stopCount = j - i;
            const isRail = route.service_type === 'lrt_concept';
            const transitMins = Math.max(2, Math.round(stopCount * (isRail ? 2.0 : 2.6)));
            const walkMins = estimateWalkMinutes(walkToBoard) + estimateWalkMinutes(walkFromAlight);
            const totalScore = walkToBoard * 2.2 + walkFromAlight * 2.2 + stopCount * 180;

            if (!bestSingleForRoute || totalScore < bestSingleForRoute.score) {
              const passStops = stops.slice(i, j + 1);
              bestSingleForRoute = {
                id: `itin-single-${route.id}-${i}-${j}`,
                type: 'single_route',
                badge: 'ต่อเดียวถึง (ไม่ต้องเปลี่ยนสาย)',
                score: totalScore,
                totalMinutes: walkMins + transitMins,
                totalWalkMeters: walkToBoard + walkFromAlight,
                transferCount: 0,
                steps: [
                  {
                    mode: 'walk',
                    fromName: originPt.name,
                    toName: boardStop.name,
                    fromCoord: [originPt.lat, originPt.lng],
                    toCoord: [Number(boardStop.latitude), Number(boardStop.longitude)],
                    distanceMeters: walkToBoard,
                    durationMinutes: estimateWalkMinutes(walkToBoard)
                  },
                  {
                    mode: 'transit',
                    route,
                    boardStop,
                    alightStop,
                    stopCount,
                    passStops,
                    durationMinutes: transitMins
                  },
                  {
                    mode: 'walk',
                    fromName: alightStop.name,
                    toName: destPt.name,
                    fromCoord: [Number(alightStop.latitude), Number(alightStop.longitude)],
                    toCoord: [destPt.lat, destPt.lng],
                    distanceMeters: walkFromAlight,
                    durationMinutes: estimateWalkMinutes(walkFromAlight)
                  }
                ]
              };
            }
          }
        }

        if (bestSingleForRoute) {
          results.push(bestSingleForRoute);
        }

      // 2. ค้นหาการเดินทางแบบต่อรถ 1 ครั้ง (ขึ้นสาย A -> เดินเปลี่ยนสายที่จุดตัด -> ขึ้นสาย B -> เดินถึงปลายทาง)
      for (let a = 0; a < routeStopLists.length; a++) {
        for (let b = 0; b < routeStopLists.length; b++) {
          if (a === b) continue;
          const rA = routeStopLists[a];
          const rB = routeStopLists[b];

          // หาป้ายขึ้นรถของสาย A ที่ใกล้จุดเริ่มต้นที่สุด 3 อันดับแรก
          const candidateBoardsA = rA.stops
            .map(st => ({
              stop: st,
              dist: calculateHaversineMeters(originPt.lat, originPt.lng, st.latitude, st.longitude)
            }))
            .filter(x => x.dist <= 4500)
            .sort((x, y) => x.dist - y.dist)
            .slice(0, 3);

          // หาป้ายลงรถของสาย B ที่ใกล้จุดหมายปลายทางที่สุด 3 อันดับแรก
          const candidateAlightsB = rB.stops
            .map(st => ({
              stop: st,
              dist: calculateHaversineMeters(st.latitude, st.longitude, destPt.lat, destPt.lng)
            }))
            .filter(x => x.dist <= 4500)
            .sort((x, y) => x.dist - y.dist)
            .slice(0, 3);

          if (candidateBoardsA.length === 0 || candidateAlightsB.length === 0) continue;

          let bestTransferPair = null;

          candidateBoardsA.forEach(boardAItem => {
            const boardA = boardAItem.stop;
            // พิจารณาป้ายลงของสาย A ที่อยู่หลังป้ายขึ้น
            for (let idxA = boardA.seqIndex + 1; idxA < rA.stops.length; idxA++) {
              const transferStopA = rA.stops[idxA];

              candidateAlightsB.forEach(alightBItem => {
                const alightB = alightBItem.stop;
                // พิจารณาป้ายขึ้นของสาย B ที่อยู่ก่อนป้ายลงปลายทาง
                for (let idxB = 0; idxB < alightB.seqIndex; idxB++) {
                  const transferStopB = rB.stops[idxB];
                  const transferWalk = calculateHaversineMeters(
                    transferStopA.latitude,
                    transferStopA.longitude,
                    transferStopB.latitude,
                    transferStopB.longitude
                  );

                  // จุดเปลี่ยนสายต้องเดินห่างกันไม่เกิน 450 เมตร
                  if (transferWalk <= 450) {
                    const stopsCountA = idxA - boardA.seqIndex;
                    const stopsCountB = alightB.seqIndex - idxB;
                    const totalWalk = boardAItem.dist + transferWalk + alightBItem.dist;
                    const transitMinsA = Math.max(2, Math.round(stopsCountA * (rA.route.service_type === 'lrt_concept' ? 2.0 : 2.6)));
                    const transitMinsB = Math.max(2, Math.round(stopsCountB * (rB.route.service_type === 'lrt_concept' ? 2.0 : 2.6)));
                    const totalMins =
                      estimateWalkMinutes(boardAItem.dist) +
                      transitMinsA +
                      estimateWalkMinutes(transferWalk) +
                      4 + // เวลาเผื่อรอเปลี่ยนสายรถ
                      transitMinsB +
                      estimateWalkMinutes(alightBItem.dist);

                    const score = totalWalk * 2.2 + (stopsCountA + stopsCountB) * 180 + 550; // บวกค่าเสียเวลาเปลี่ยนสายเล็กน้อย

                    if (!bestTransferPair || score < bestTransferPair.score) {
                      bestTransferPair = {
                        id: `itin-transfer-${rA.route.id}-${rB.route.id}-${boardA.seqIndex}-${idxA}-${idxB}-${alightB.seqIndex}`,
                        type: 'transfer_1',
                        badge: `ต่อรถ 1 ครั้ง (${rA.route.code} ➔ ${rB.route.code})`,
                        score,
                        totalMinutes: totalMins,
                        totalWalkMeters: totalWalk,
                        transferCount: 1,
                        steps: [
                          {
                            mode: 'walk',
                            fromName: originPt.name,
                            toName: boardA.name,
                            fromCoord: [originPt.lat, originPt.lng],
                            toCoord: [Number(boardA.latitude), Number(boardA.longitude)],
                            distanceMeters: boardAItem.dist,
                            durationMinutes: estimateWalkMinutes(boardAItem.dist)
                          },
                          {
                            mode: 'transit',
                            route: rA.route,
                            boardStop: boardA,
                            alightStop: transferStopA,
                            stopCount: stopsCountA,
                            passStops: rA.stops.slice(boardA.seqIndex, idxA + 1),
                            durationMinutes: transitMinsA
                          },
                          {
                            mode: 'transfer_walk',
                            fromName: transferStopA.name,
                            toName: transferStopB.name,
                            fromCoord: [Number(transferStopA.latitude), Number(transferStopA.longitude)],
                            toCoord: [Number(transferStopB.latitude), Number(transferStopB.longitude)],
                            distanceMeters: transferWalk,
                            durationMinutes: Math.max(2, estimateWalkMinutes(transferWalk))
                          },
                          {
                            mode: 'transit',
                            route: rB.route,
                            boardStop: transferStopB,
                            alightStop: alightB,
                            stopCount: stopsCountB,
                            passStops: rB.stops.slice(idxB, alightB.seqIndex + 1),
                            durationMinutes: transitMinsB
                          },
                          {
                            mode: 'walk',
                            fromName: alightB.name,
                            toName: destPt.name,
                            fromCoord: [Number(alightB.latitude), Number(alightB.longitude)],
                            toCoord: [destPt.lat, destPt.lng],
                            distanceMeters: alightBItem.dist,
                            durationMinutes: estimateWalkMinutes(alightBItem.dist)
                          }
                        ]
                      };
                    }
                  }
                }
              });
            }
          });

          if (bestTransferPair) {
            results.push(bestTransferPair);
          }
        }
      }

      // 3. หากระยะทางใกล้กัน หรือต้องการตัวเลือกเดินเท้าล้วนเปรียบเทียบ
      if (directWalkMeters <= 2500 || results.length === 0) {
        results.push({
          id: 'itin-walk-only',
          type: 'walk_only',
          badge: '🚶 เดินเท้าตลอดสาย (พื้นที่นอกแนวรถ/ระยะใกล้)',
          score: directWalkMeters * 3.0,
          totalMinutes: estimateWalkMinutes(directWalkMeters),
          totalWalkMeters: directWalkMeters,

          steps: [
            {
              mode: 'walk',
              fromName: originPt.name,
              toName: destPt.name,
              fromCoord: [originPt.lat, originPt.lng],
              toCoord: [destPt.lat, destPt.lng],
              distanceMeters: directWalkMeters,
              durationMinutes: estimateWalkMinutes(directWalkMeters)
            }
          ]
        });
      }

      return results.sort((a, b) => a.score - b.score).slice(0, 5);
    }

    // ฟังก์ชันเชื่อมต่อ Gemini API (LLM)
    const callGeminiAPI = async (prompt, systemInstruction = "คุณคือผู้เชี่ยวชาญด้านการวางแผนระบบขนส่งมวลชน", asJson = false) => {
      const apiKey = ""; // API Key will be injected automatically
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
      const payload = {
        contents: [{ role: "user", parts: [{ text: prompt }] }],
        systemInstruction: { parts: [{ text: systemInstruction }] }
      };
      
      if (asJson) {
        payload.generationConfig = { responseMimeType: "application/json" };
      }

      let retries = 3;
      let delay = 1000;
      while (retries > 0) {
        try {
          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
          const result = await response.json();
          if (result.candidates && result.candidates[0].content.parts[0].text) {
            return result.candidates[0].content.parts[0].text;
          }
          throw new Error("Invalid response format");
        } catch (e) {
          retries--;
          if (retries === 0) throw e;
          await new Promise(res => setTimeout(res, delay));
          delay *= 2;
        }
      }
    };

    function calculateHaversineMeters(lat1, lon1, lat2, lon2) {
      const nLat1 = Number(lat1);
      const nLon1 = Number(lon1);
      const nLat2 = Number(lat2);
      const nLon2 = Number(lon2);
      if (!Number.isFinite(nLat1) || !Number.isFinite(nLon1) || !Number.isFinite(nLat2) || !Number.isFinite(nLon2)) {
        return 999999;
      }
      const R = 6371000;
      const toRad = d => (d * Math.PI) / 180;
      const dLat = toRad(nLat2 - nLat1);
      const dLon = toRad(nLon2 - nLon1);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(nLat1)) * Math.cos(toRad(nLat2)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return Math.round(R * c);
    }

    // คอมเมนต์เริ่มต้นตั้งเป็นค่าว่างทั้งหมดเพื่อรอการรับฟังจากประชาชน
    const INITIAL_COMMENTS = {};

    // แคชข้อมูลเส้นทาง OSRM
    const osrmMemoryCache = new Map();
    try {
      const savedCache = localStorage.getItem(STORAGE_KEYS.OSRM_CACHE);
      if (savedCache) {
        const parsed = JSON.parse(savedCache);
        Object.entries(parsed).forEach(([k, v]) => osrmMemoryCache.set(k, v));
      }
    } catch (e) {}

    function saveOsrmCacheToStorage() {
      try {
        if (osrmMemoryCache.size > 50) {
          const firstKey = osrmMemoryCache.keys().next().value;
          osrmMemoryCache.delete(firstKey);
        }
        const obj = Object.fromEntries(osrmMemoryCache.entries());
        localStorage.setItem(STORAGE_KEYS.OSRM_CACHE, JSON.stringify(obj));
      } catch (e) {}
    }

    async function fetchWithTimeout(url, options = {}, timeoutMs = 6000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const response = await fetch(url, { ...options, signal: controller.signal });
        clearTimeout(timer);
        return response;
      } catch (err) {
        clearTimeout(timer);
        throw err;
      }
    }

    async function snapPointToNearestRoad(lat, lng, routingTier = 'main_corridor_only') {
      const safeLat = Number(lat);
      const safeLng = Number(lng);
      if (!Number.isFinite(safeLat) || !Number.isFinite(safeLng)) {
        return { lat: 18.7883, lng: 98.9853, roadName: '', snapped: false, isSoiWarning: false };
      }
      try {
        const url = `https://router.project-osrm.org/nearest/v1/driving/${safeLng.toFixed(5)},${safeLat.toFixed(5)}?number=3`;
        const res = await fetchWithTimeout(url, {}, 4000);
        if (!res.ok) {
          return { lat: Number(safeLat.toFixed(5)), lng: Number(safeLng.toFixed(5)), roadName: '', snapped: false, isSoiWarning: false };
        }
        const data = await res.json();
        if (data.code === 'Ok' && data.waypoints && data.waypoints.length > 0) {
          let chosenWp = data.waypoints[0];
          let isSoiWarning = false;

          if (routingTier === 'main_corridor_only') {
            const mainRoadWp = data.waypoints.find(wp => !isMinorSoiName(wp.name || ''));
            if (mainRoadWp) {
              chosenWp = mainRoadWp;
            } else if (isMinorSoiName(chosenWp.name || '')) {
              isSoiWarning = true;
            }
          }

          return {
            lat: Number(chosenWp.location[1].toFixed(5)),
            lng: Number(chosenWp.location[0].toFixed(5)),
            roadName: chosenWp.name || '',
            snapped: true,
            isSoiWarning
          };
        }
        return { lat: Number(safeLat.toFixed(5)), lng: Number(safeLng.toFixed(5)), roadName: '', snapped: false, isSoiWarning: false };
      } catch {
        return { lat: Number(safeLat.toFixed(5)), lng: Number(safeLng.toFixed(5)), roadName: '', snapped: false, isSoiWarning: false };
      }
    }

    // คำนวณแนวเส้นทางตามโครงข่ายถนนจริงด้วย OSRM (เฉพาะสายรถไฟฟ้าเท่านั้นที่พิจารณา station_level ใต้ดิน/ลอยฟ้า)
    async function fetchOsrmRoadGeometry(stopsList, routingTier = 'main_corridor_only', isRailService = false) {
      const validStops = Array.isArray(stopsList)
        ? stopsList.filter(st => st && Number.isFinite(Number(st.latitude)) && Number.isFinite(Number(st.longitude)))
        : [];

      if (validStops.length < 2) {
        return { success: false, coordinates: null, distanceMeters: null, soiSegmentsDetected: [], segmentLayers: [] };
      }

      const cacheKey =
        `${routingTier}::rail_${isRailService}::` +
        validStops
          .map(st => `${Number(st.latitude).toFixed(4)},${Number(st.longitude).toFixed(4)}:${isRailService ? st.station_level || 'at_grade' : 'surface'}`)
          .join('|');

      if (osrmMemoryCache.has(cacheKey)) {
        return osrmMemoryCache.get(cacheKey);
      }

      const hasUndergroundStop = isRailService && validStops.some(st => st && st.station_level === 'underground');

      // กรณีรถไฟฟ้าและมีสถานีใต้ดิน: คำนวณแยกทีละช่วงสถานี
      if (hasUndergroundStop) {
        try {
          const combinedCoords = [];
          let totalDistanceMeters = 0;
          const allSoiDetected = new Set();
          const segmentLayers = [];

          for (let i = 0; i < validStops.length - 1; i++) {
            const stopA = validStops[i];
            const stopB = validStops[i + 1];
            const levelA = stopA.station_level || 'at_grade';
            const levelB = stopB.station_level || 'at_grade';
            const isUndergroundTunnelSegment = levelA === 'underground' || levelB === 'underground';

            if (isUndergroundTunnelSegment) {
              const directCoords = [
                [Number(stopA.latitude), Number(stopA.longitude)],
                [Number(stopB.latitude), Number(stopB.longitude)]
              ];
              const tunnelDist = calculateHaversineMeters(
                Number(stopA.latitude),
                Number(stopA.longitude),
                Number(stopB.latitude),
                Number(stopB.longitude)
              );
              totalDistanceMeters += tunnelDist;

              if (combinedCoords.length === 0) {
                combinedCoords.push(...directCoords);
              } else {
                combinedCoords.push(directCoords[1]);
              }

              segmentLayers.push({
                mode: 'underground_tunnel',
                fromLevel: levelA,
                toLevel: levelB,
                coordinates: directCoords,
                distanceMeters: tunnelDist
              });
            } else {
              const pairCoordStr = `${Number(stopA.longitude).toFixed(5)},${Number(stopA.latitude).toFixed(5)};${Number(stopB.longitude).toFixed(5)},${Number(stopB.latitude).toFixed(5)}`;
              const url = `https://router.project-osrm.org/route/v1/driving/${pairCoordStr}?overview=full&geometries=geojson&steps=true`;
              let segCoords = [
                [Number(stopA.latitude), Number(stopA.longitude)],
                [Number(stopB.latitude), Number(stopB.longitude)]
              ];
              let segDist = calculateHaversineMeters(
                Number(stopA.latitude),
                Number(stopA.longitude),
                Number(stopB.latitude),
                Number(stopB.longitude)
              );

              try {
                const res = await fetchWithTimeout(url, {}, 4500);
                if (res.ok) {
                  const data = await res.json();
                  if (data.code === 'Ok' && data.routes && data.routes.length > 0) {
                    const rt = data.routes[0];
                    segCoords = rt.geometry.coordinates.map(pt => [pt[1], pt[0]]);
                    if (typeof rt.distance === 'number') {
                      segDist = Math.round(rt.distance);
                    }
                    (rt.legs || []).forEach(leg => {
                      (leg.steps || []).forEach(step => {
                        if (step.name && isMinorSoiName(step.name)) {
                          allSoiDetected.add(step.name);
                        }
                      });
                    });
                  }
                }
              } catch {}

              totalDistanceMeters += segDist;
              if (combinedCoords.length === 0) {
                combinedCoords.push(...segCoords);
              } else {
                combinedCoords.push(...segCoords.slice(1));
              }

              segmentLayers.push({
                mode: levelA === 'elevated' || levelB === 'elevated' ? 'elevated_road' : 'at_grade_road',
                fromLevel: levelA,
                toLevel: levelB,
                coordinates: segCoords,
                distanceMeters: segDist
              });
            }
          }

          const resultObj = {
            success: true,
            coordinates: combinedCoords,
            distanceMeters: totalDistanceMeters,
            soiSegmentsDetected: Array.from(allSoiDetected),
            segmentLayers
          };
          osrmMemoryCache.set(cacheKey, resultObj);
          saveOsrmCacheToStorage();
          return resultObj;
        } catch {
          return { success: false, coordinates: null, distanceMeters: null, soiSegmentsDetected: [], segmentLayers: [] };
        }
      }

      // กรณีรถทั่วไป หรือรถไฟฟ้าระดับดิน/ลอยฟ้าล้วน: ดึงแนวถนนจริงจาก OSRM
      try {
        const coordString = validStops
          .map(st => `${Number(st.longitude).toFixed(5)},${Number(st.latitude).toFixed(5)}`)
          .join(';');
        const canUseAlternatives = validStops.length <= 15;
        const url = `https://router.project-osrm.org/route/v1/driving/${coordString}?overview=full&geometries=geojson&steps=true${canUseAlternatives ? '&alternatives=true' : ''}`;
        const response = await fetchWithTimeout(url, {}, 7000);
        if (!response.ok) {
          return { success: false, coordinates: null, distanceMeters: null, soiSegmentsDetected: [], segmentLayers: [] };
        }
        const data = await response.json();
        if (data.code === 'Ok' && data.routes && data.routes.length > 0) {
          let selectedRoute = data.routes[0];

          const analyzeSoiSteps = rt => {
            const soiNames = new Set();
            (rt.legs || []).forEach(leg => {
              (leg.steps || []).forEach(step => {
                if (step.name && isMinorSoiName(step.name)) {
                  soiNames.add(step.name);
                }
              });
            });
            return Array.from(soiNames);
          };

          if (routingTier === 'main_corridor_only' && data.routes.length > 1) {
            let bestRoute = data.routes[0];
            let minSoiCount = analyzeSoiSteps(bestRoute).length;
            for (let i = 1; i < data.routes.length; i++) {
              const candidateSois = analyzeSoiSteps(data.routes[i]);
              if (candidateSois.length < minSoiCount) {
                bestRoute = data.routes[i];
                minSoiCount = candidateSois.length;
              }
            }
            selectedRoute = bestRoute;
          }

          const soiSegmentsDetected = analyzeSoiSteps(selectedRoute);
          const leafletCoords = selectedRoute.geometry.coordinates.map(pt => [pt[1], pt[0]]);
          const distVal = typeof selectedRoute.distance === 'number' ? Math.round(selectedRoute.distance) : null;

          const resultObj = {
            success: true,
            coordinates: leafletCoords,
            distanceMeters: distVal,
            soiSegmentsDetected,
            segmentLayers: [
              {
                mode: 'at_grade_road',
                coordinates: leafletCoords,
                distanceMeters: distVal
              }
            ]
          };
          osrmMemoryCache.set(cacheKey, resultObj);
          saveOsrmCacheToStorage();
          return resultObj;
        }
        return { success: false, coordinates: null, distanceMeters: null, soiSegmentsDetected: [], segmentLayers: [] };
      } catch {
        return { success: false, coordinates: null, distanceMeters: null, soiSegmentsDetected: [], segmentLayers: [] };
      }
    }

      const analyzeRouteDetail = async () => {

             straightDist += calculateHaversineMeters(stops[i].latitude, stops[i].longitude, stops[i+1].latitude, stops[i+1].longitude);

- จำนวนจุดจอดทั้งหมด: ${stops.length} สถานี
- ระยะห่างสถานีเฉลี่ย: ${avgDist.toFixed(0)} เมตร
- ลำดับป้ายจุดจอดที่สำคัญ: ${stopNames}

กรุณาวิเคราะห์ประสิทธิภาพของเส้นทางนี้ โดยครอบคลุมประเด็นต่อไปนี้:
1. ความเหมาะสมของระยะห่างป้ายเฉลี่ย กับประเภทยานพาหนะที่เลือกใช้ (ถี่ไป หรือ ห่างไปหรือไม่?)

3. ข้อเสนอแนะ 1-2 ข้อ เพื่อปรับปรุงเส้นทางนี้ให้ดียิ่งขึ้น

กรุณาตอบเป็นภาษาไทย โดยใช้ HTML Tags (เช่น <b>, <ul>, <li>, <br/>) เพื่อจัดรูปแบบให้อ่านง่ายและสวยงาม (ห้ามใช้ Markdown อย่างเด็ดขาด ให้คืนค่าเป็น HTML ล้วนๆ)`;

          const htmlResult = await callGeminiAPI(

          setAiAnalysisResult('⚠️ ไม่สามารถเชื่อมต่อกับ Gemini AI ได้ในขณะนี้ กรุณาลองตรวจสอบการเชื่อมต่ออินเทอร์เน็ตแล้วกดวิเคราะห์ใหม่อีกครั้ง');

      // ค้นหาพิกัดจากชื่อสถานที่ (ตรวจสอบใน POPULAR_PLACES_CM -> ป้ายรถเมล์ -> Nominatim OpenStreetMap เชียงใหม่)
      const resolvePlaceFromQuery = async (queryText) => {
        const q = String(queryText || '').trim().toLowerCase();
        if (!q) return null;

        // 1. ค้นในสถานที่ยอดนิยมเชียงใหม่
        const matchedPlace = POPULAR_PLACES_CM.find(
          p => p.name.toLowerCase().includes(q) || p.keywords.toLowerCase().includes(q)
        );
        if (matchedPlace) {
          return { name: matchedPlace.name, lat: matchedPlace.lat, lng: matchedPlace.lng };
        }

        // 2. ค้นในป้ายรถเมล์/สถานีที่มีอยู่ทั้งหมด
        const allStops = Object.values(stopsMap);
        const matchedStop = allStops.find(
          st =>
            (st.name || '').toLowerCase().includes(q) ||
            (st.name_th || '').toLowerCase().includes(q) ||
            (st.name_en || '').toLowerCase().includes(q) ||
            (st.code || '').toLowerCase() === q
        );
        if (matchedStop) {
          return {
            name: matchedStop.name,
            lat: Number(matchedStop.latitude),
            lng: Number(matchedStop.longitude)
          };
        }

        // 3. ค้นหาผ่าน OpenStreetMap Nominatim ในพื้นที่จังหวัดเชียงใหม่
        try {
          setIsSearchingGeocoder(true);
          const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(queryText + ' เชียงใหม่')}&limit=1`;
          const res = await fetchWithTimeout(url, {}, 4500);
          setIsSearchingGeocoder(false);
          if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data) && data.length > 0) {
              return {
                name: data[0].display_name.split(',')[0] || queryText,
                lat: Number(Number(data[0].lat).toFixed(5)),
                lng: Number(Number(data[0].lon).toFixed(5))
              };
            }
          }
        } catch {
          setIsSearchingGeocoder(false);
        }
        return null;
      };

      const executeTripSearch = async (customOrigin, customDest) => {
        let orig = customOrigin || tripOriginPoint;
        let dest = customDest || tripDestPoint;

        if (!customOrigin && tripOriginText.trim()) {
          const resolvedO = await resolvePlaceFromQuery(tripOriginText);
          if (resolvedO) {
            orig = resolvedO;
            setTripOriginPoint(resolvedO);
          }
        }
        if (!customDest && tripDestText.trim()) {
          const resolvedD = await resolvePlaceFromQuery(tripDestText);
          if (resolvedD) {
            dest = resolvedD;
            setTripDestPoint(resolvedD);
          }
        }

        if (!orig || !dest) {
          showNotification('ไม่พบพิกัดสถานที่ กรุณาเลือกจากรายการแนะนำ หรือกดปุ่ม "📍 จิ้มบนแผนที่"', 'error');
          return;
        }

        const usableRoutes = routes.filter(
          r => Boolean(tripAllowedStatuses[r.operation_status || 'operating'])
        );
        const plans = computeTransitItineraries(orig, dest, usableRoutes, stopsMap);
        setTripItineraries(plans);
        setSelectedItineraryIndex(0);

        const map = mapInstanceRef.current;
        if (map) {
          try {
            map.fitBounds(
              L.latLngBounds([
                [orig.lat, orig.lng],
                [dest.lat, dest.lng]
              ]),
              { padding: [60, 60], maxZoom: 15 }
            );
          } catch {}
        }
      };

      // คำนวณเส้นทางเริ่มต้นเมื่อเปิดแท็บค้นหาการเดินทาง
      useEffect(() => {
        if (activeTab === 'trip_planner' && tripOriginPoint && tripDestPoint) {
          const usableRoutes = routes.filter(
            r => Boolean(tripAllowedStatuses[r.operation_status || 'operating'])
          );
          const plans = computeTransitItineraries(tripOriginPoint, tripDestPoint, usableRoutes, stopsMap);
          setTripItineraries(plans);
          setSelectedItineraryIndex(0);
        }
      }, [activeTab, tripOriginPoint, tripDestPoint, routes, stopsMap, tripAllowedStatuses]);

      // ดึงพิกัดตามแนวถนนจริง (OSRM) สำหรับทุกช่วงของการเดินทางที่เลือก (ทั้งช่วงนั่งรถโดยสารและช่วงเดินเท้าตามถนน)
      useEffect(() => {
        let isMounted = true;
        async function hydrateActivePlanRoadPaths() {
          if (activeTab !== 'trip_planner') return;
          const plan = tripItineraries[selectedItineraryIndex];
          if (!plan || plan.roadHydrated) return;

          setIsHydratingTripRoads(true);
          let hasChanged = false;
          const updatedSteps = [];

          for (let i = 0; i < plan.steps.length; i++) {
            const step = { ...plan.steps[i] };

            if (step.mode === 'transit' && step.route && Array.isArray(step.passStops)) {
              // 1. ลองตัดช่วงพิกัดจาก road_coordinates ของสายรถที่มีอยู่แล้ว
              let roadSlice = extractRouteSubpathOnRoad(step.route, step.passStops);

              // 2. หากสายรถยังไม่มี road_coordinates ละเอียด ให้คำนวณผ่าน OSRM ตามป้ายที่ผ่านจริง
              if (roadSlice.length <= step.passStops.length) {
                const isRail = Boolean(SERVICE_TYPES[step.route.service_type]?.supportsStationLevels);
                const tier = SERVICE_TYPES[step.route.service_type]?.tier || 'main_corridor_only';
                const osrmRes = await fetchOsrmRoadGeometry(step.passStops, tier, isRail);
                if (osrmRes.success && Array.isArray(osrmRes.coordinates) && osrmRes.coordinates.length >= 2) {
                  roadSlice = osrmRes.coordinates;
                }
              }

              step.roadPathCoords = roadSlice;
              hasChanged = true;
            } else if ((step.mode === 'walk' || step.mode === 'transfer_walk') && step.fromCoord && step.toCoord) {
              // คำนวณแนวถนน/ซอยสำหรับช่วงเดินเท้าด้วย OSRM เพื่อให้เดินเกาะตามแนวถนนจริง
              if (step.distanceMeters > 25) {
                const pseudoStops = [
                  { latitude: step.fromCoord[0], longitude: step.fromCoord[1], station_level: 'at_grade' },
                  { latitude: step.toCoord[0], longitude: step.toCoord[1], station_level: 'at_grade' }
                ];
                const walkOsrm = await fetchOsrmRoadGeometry(pseudoStops, 'local_soi_allowed', false);
                if (walkOsrm.success && Array.isArray(walkOsrm.coordinates) && walkOsrm.coordinates.length >= 2) {
                  step.walkRoadCoords = walkOsrm.coordinates;
                  if (typeof walkOsrm.distanceMeters === 'number' && walkOsrm.distanceMeters > 0) {
                    step.distanceMeters = walkOsrm.distanceMeters;
                    step.durationMinutes = estimateWalkMinutes(walkOsrm.distanceMeters);
                  }
                  hasChanged = true;
                }
              }
            }

            updatedSteps.push(step);
          }

          if (!isMounted) return;
          setIsHydratingTripRoads(false);

          if (hasChanged) {
            setTripItineraries(prev =>
              prev.map((item, idx) => {
                if (idx !== selectedItineraryIndex) return item;
                const newWalkTotal = updatedSteps
                  .filter(s => s.mode === 'walk' || s.mode === 'transfer_walk')
                  .reduce((acc, s) => acc + (s.distanceMeters || 0), 0);
                const newTotalMins = updatedSteps.reduce((acc, s) => acc + (s.durationMinutes || 0), 0);
                return {
                  ...item,
                  steps: updatedSteps,
                  totalWalkMeters: newWalkTotal,
                  totalMinutes: newTotalMins,
                  roadHydrated: true
                };
              })
            );
          }
        }

        hydrateActivePlanRoadPaths();
        return () => {
          isMounted = false;
        };
      }, [activeTab, tripItineraries, selectedItineraryIndex]);

      const showNotification = (message, type = 'info') => {

      // โหลดแนวถนนจริงจาก OSRM แบบทยอยทีละสายตอนเปิดแอป
      useEffect(() => {
        let isMounted = true;
        async function hydrateRoutesSequentially() {
          for (let i = 0; i < routes.length; i++) {
            if (!isMounted) return;
            const r = routes[i];
            const isRail = Boolean(SERVICE_TYPES[r.service_type]?.supportsStationLevels);
            const rTier = SERVICE_TYPES[r.service_type]?.tier || 'main_corridor_only';
            const stopObjs = (r.stop_ids || []).map(sid => stopsMap[sid]).filter(Boolean);
            const hasUnderground = isRail && stopObjs.some(st => st.station_level === 'underground');

            if (!r.road_coordinates || (hasUnderground && !r.segment_layers) || (!hasUnderground && r.road_coordinates.length < 10)) {
              if (stopObjs.length >= 2) {
                const res = await fetchOsrmRoadGeometry(stopObjs, rTier, isRail);
                if (res.success && res.coordinates && isMounted) {
                  setRoutes(prevRoutes =>

                            road_coordinates: res.coordinates,
                            segment_layers: res.segmentLayers || [],
                            road_distance_meters: res.distanceMeters
                          }
                        : item
                    )
                  );
                }
                await new Promise(resolve => setTimeout(resolve, 250));

      // คำนวณจุดเชื่อมต่อระหว่างสาย (Transfer Intersections ในรัศมี <= 150 เมตร)
      const transferIntersections = useMemo(() => {
        const visibleRoutes = routes.filter(
          r => r.visible && Boolean(enabledOperationStatuses[r.operation_status || 'operating'])
        );
        const hubs = [];
        const processedPairs = new Set();

        for (let i = 0; i < visibleRoutes.length; i++) {
          for (let j = i + 1; j < visibleRoutes.length; j++) {
            const routeA = visibleRoutes[i];
            const routeB = visibleRoutes[j];
            const isRailA = Boolean(SERVICE_TYPES[routeA.service_type]?.supportsStationLevels);
            const isRailB = Boolean(SERVICE_TYPES[routeB.service_type]?.supportsStationLevels);

            (routeA.stop_ids || []).forEach(stopIdA => {
              const stopA = stopsMap[stopIdA];
              if (!stopA) return;

              (routeB.stop_ids || []).forEach(stopIdB => {
                const stopB = stopsMap[stopIdB];
                if (!stopB) return;

                const dist = stopIdA === stopIdB
                  ? 0
                  : calculateHaversineMeters(stopA.latitude, stopA.longitude, stopB.latitude, stopB.longitude);

                if (dist <= 150) {
                  const pairKey = [stopIdA, stopIdB].sort().join('__');
                  if (!processedPairs.has(pairKey)) {
                    processedPairs.add(pairKey);
                    const levelA = isRailA ? stopA.station_level || 'at_grade' : 'at_grade';
                    const levelB = isRailB ? stopB.station_level || 'at_grade' : 'at_grade';
                    hubs.push({
                      id: `hub-${pairKey}`,
                      stopA,
                      stopB,
                      routeA,
                      routeB,
                      distanceMeters: dist,
                      isSharedStop: stopIdA === stopIdB,
                      isVerticalTransfer: levelA !== levelB,
                      levelA,
                      levelB,
                      centerLat: (Number(stopA.latitude) + Number(stopB.latitude)) / 2,
                      centerLng: (Number(stopA.longitude) + Number(stopB.longitude)) / 2
                    });
                  }
                }
              });
            });
          }
        }
        return hubs;
      }, [routes, stopsMap, enabledOperationStatuses]);

      // อัปเดตเส้นทาง OSRM อัตโนมัติเมื่อแก้ไขจุดจอดในหน้า Studio

      // ฟังก์ชันแทรกจุดจอดกึ่งกลางระหว่างป้ายคู่ใดๆ ได้ทันที (Quick Midpoint Insert)
      const handleQuickInsertStopBetween = async (afterIndex) => {

      // คลิกบนแผนที่เพื่อเพิ่มจุดจอด (รองรับทั้งโหมดต่อท้าย และโหมดแทรกระหว่างจุด)
      useEffect(() => {

      useEffect(() => {
        const map = mapInstanceRef.current;

        layerGroup.clearLayers();

        // ฟังก์ชันวาดลูกศรบอกทิศทางการเดินรถตามแนวเส้นทาง (Directional Flow Arrows)
        const drawDirectionArrowsAlongPath = (coords, colorHex, isHighlighted, onClickHandler) => {
          if (!showDirectionArrows || !Array.isArray(coords) || coords.length < 2) return;

          // คำนวณระยะห่างขั้นต่ำตามความยาวพิกัด เพื่อวางลูกศรในจังหวะที่สวยงามไม่ถี่หรือห่างเกินไป
          const minSpacingMeters = isHighlighted ? 420 : 650;
          let accumulatedDist = minSpacingMeters * 0.55; // เริ่มวางลูกศรแรกใกล้ช่วงต้นสาย

          for (let i = 0; i < coords.length - 1; i++) {
            const ptA = coords[i];
            const ptB = coords[i + 1];
            const lat1 = Number(ptA[0]);
            const lng1 = Number(ptA[1]);
            const lat2 = Number(ptB[0]);
            const lng2 = Number(ptB[1]);

            if (!Number.isFinite(lat1) || !Number.isFinite(lng1) || !Number.isFinite(lat2) || !Number.isFinite(lng2)) {
              continue;
            }

            const segDist = calculateHaversineMeters(lat1, lng1, lat2, lng2);
            if (segDist <= 3) continue;

            accumulatedDist += segDist;

            if (accumulatedDist >= minSpacingMeters) {
              accumulatedDist = 0;
              const midLat = (lat1 + lat2) / 2;
              const midLng = (lng1 + lng2) / 2;

              // คำนวณมุมมุ่งหน้าบนระนาบแผนที่ (0 องศา = ทิศเหนือ, หมุนตามเข็มนาฬิกา)
              const p1 = map.latLngToContainerPoint([lat1, lng1]);
              const p2 = map.latLngToContainerPoint([lat2, lng2]);
              const dx = p2.x - p1.x;
              const dy = p2.y - p1.y;
              if (Math.hypot(dx, dy) < 2) continue;

              const angleDeg = (Math.atan2(dx, -dy) * 180) / Math.PI;
              const size = isHighlighted ? 20 : 16;

              const arrowIcon = L.divIcon({
                className: 'route-direction-arrow-icon',
                html: `<div style="width:${size}px;height:${size}px;display:flex;align-items:center;justify-content:center;transform:rotate(${angleDeg.toFixed(1)}deg);pointer-events:auto;">
                  <svg width="${size}" height="${size}" viewBox="0 0 24 24" style="filter:drop-shadow(0 1px 2px rgba(15,23,42,0.45));">
                    <circle cx="12" cy="12" r="9.5" fill="${colorHex}" stroke="#ffffff" stroke-width="2" />
                    <path d="M12 6.2 L17.2 15.8 L12 13.4 L6.8 15.8 Z" fill="#ffffff" />
                  </svg>
                </div>`,
                iconSize: [size, size],
                iconAnchor: [size / 2, size / 2]
              });

              const arrowMarker = L.marker([midLat, midLng], {
                icon: arrowIcon,
                interactive: Boolean(onClickHandler),
                keyboard: false
              }).addTo(layerGroup);

              if (onClickHandler) {
                arrowMarker.on('click', onClickHandler);
              }
            }
          }
        };

        // ฟังก์ชันวาดเส้นทางตามประเภทรถ (เฉพาะรถไฟฟ้าเท่านั้นที่แยกเส้นใต้ดิน/ลอยฟ้า)
        const drawRouteGeometryLayers = (routeObj, isHighlighted, onClickHandler) => {
          const stopObjs = (routeObj.stop_ids || []).map(sid => stopsMap[sid]).filter(Boolean);
          if (stopObjs.length < 2) return;
          const isRail = Boolean(SERVICE_TYPES[routeObj.service_type]?.supportsStationLevels);
          const isLrt = routeObj.service_type === 'lrt_concept';

          if (isRail && Array.isArray(routeObj.segment_layers) && routeObj.segment_layers.length > 0) {
            routeObj.segment_layers.forEach(seg => {
              if (!seg.coordinates || seg.coordinates.length < 2) return;
              if (seg.mode === 'underground_tunnel') {
                L.polyline(seg.coordinates, {
                  color: '#4c1d95',
                  weight: isHighlighted ? 9 : 7,
                  opacity: isHighlighted ? 0.35 : 0.22,
                  lineCap: 'round'
                }).addTo(layerGroup);

                const tunnelLine = L.polyline(seg.coordinates, {
                  color: '#6d28d9',
                  weight: isHighlighted ? 5 : 4,
                  opacity: 0.95,
                  dashArray: '8, 8'
                }).addTo(layerGroup);

                if (onClickHandler) tunnelLine.on('click', onClickHandler);
                if (!isLrt) drawDirectionArrowsAlongPath(seg.coordinates, '#6d28d9', isHighlighted, onClickHandler);
              } else if (seg.mode === 'elevated_road') {
                L.polyline(seg.coordinates, {
                  color: '#0284c7',
                  weight: isHighlighted ? 9 : 7,
                  opacity: 0.35
                }).addTo(layerGroup);

                const elevLine = L.polyline(seg.coordinates, {
                  color: routeObj.color_hex,
                  weight: isHighlighted ? 6 : 4.5,
                  opacity: 0.95
                }).addTo(layerGroup);

                if (onClickHandler) elevLine.on('click', onClickHandler);
                if (!isLrt) drawDirectionArrowsAlongPath(seg.coordinates, routeObj.color_hex, isHighlighted, onClickHandler);
              } else {
                const roadLine = L.polyline(seg.coordinates, {
                  color: routeObj.color_hex,
                  weight: isHighlighted ? 6 : 4.5,
                  opacity: isHighlighted ? 0.95 : 0.82
                }).addTo(layerGroup);

                if (onClickHandler) roadLine.on('click', onClickHandler);
                if (!isLrt) drawDirectionArrowsAlongPath(seg.coordinates, routeObj.color_hex, isHighlighted, onClickHandler);
              }
            });
            return;
          }

          const hasRoadPath =
            routeObj.geometry_type === 'verified_road_network' &&
            Array.isArray(routeObj.road_coordinates) &&
            routeObj.road_coordinates.length >= 2;

          const latlngs = hasRoadPath
            ? routeObj.road_coordinates
            : stopObjs.map(s => [Number(s.latitude), Number(s.longitude)]);

          if (isHighlighted) {
            L.polyline(latlngs, {
              color: '#ffffff',
              weight: 9,
              opacity: 0.85
            }).addTo(layerGroup);
          }

          const poly = L.polyline(latlngs, {
            color: routeObj.color_hex,
            weight: isHighlighted ? 6 : 4.5,
            opacity: isHighlighted ? 0.95 : 0.8,
            dashArray: hasRoadPath ? null : '8, 8'
          }).addTo(layerGroup);

          if (onClickHandler) poly.on('click', onClickHandler);
          if (!isLrt) drawDirectionArrowsAlongPath(latlngs, routeObj.color_hex, isHighlighted, onClickHandler);
        };

        // 1. โหมดกำลังออกแบบเส้นทางใน Studio (พร้อมปุ่ม "+" กึ่งกลางบนแผนที่เพื่อแทรกป้ายได้ทันที)
        if (activeTab === 'studio') {
          const studioStops = studioForm.stop_ids.map(sid => stopsMap[sid]).filter(Boolean);
          const isRailStudio = Boolean(SERVICE_TYPES[studioForm.service_type]?.supportsStationLevels);

          if (studioStops.length >= 2) {
            drawRouteGeometryLayers(
              {
                ...studioForm,
                segment_layers: studioForm.segment_layers,
                road_coordinates: studioForm.road_coordinates
              },
              true,
              null
            );

            // วาดปุ่ม "+" กึ่งกลางระหว่างแต่ละป้ายบนแผนที่ เพื่อให้คลิกแทรกจุดระหว่างป้ายได้ทันที
            for (let i = 0; i < studioStops.length - 1; i++) {
              const sA = studioStops[i];
              const sB = studioStops[i + 1];
              const midLat = (Number(sA.latitude) + Number(sB.latitude)) / 2;
              const midLng = (Number(sA.longitude) + Number(sB.longitude)) / 2;

              const midIcon = L.divIcon({
                className: 'studio-midpoint-insert',
                html: `<div title="คลิกเพื่อแทรกจุดจอดระหว่างป้าย #${i + 1} และ #${i + 2}" style="background:#ffffff;color:#2563eb;width:22px;height:22px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;border:2px solid #2563eb;box-shadow:0 2px 6px rgba(37,99,235,0.35);cursor:pointer;">+</div>`,
                iconSize: [22, 22],
                iconAnchor: [11, 11]
              });

              const midMarker = L.marker([midLat, midLng], { icon: midIcon }).addTo(layerGroup);
              midMarker.on('click', ev => {
                L.DomEvent.stopPropagation(ev);
                handleQuickInsertStopBetween(i);
              });
            }
          }

          studioStops.forEach((st, idx) => {
            const isOrigin = idx === 0;
            const isDest = idx === studioStops.length - 1 && studioStops.length > 1;
            const stLevel = isRailStudio ? st.station_level || 'at_grade' : 'at_grade';
            const badgeBg = isOrigin
              ? '#16a34a'
              : isDest
              ? '#dc2626'
              : stLevel === 'underground'
              ? '#6d28d9'
              : stLevel === 'elevated'
              ? '#0284c7'
              : studioForm.color_hex;

            const icon = L.divIcon({
              className: 'custom-studio-stop',
              html: `<div style="background:${badgeBg};color:#fff;width:28px;height:28px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.35);">${idx + 1}</div>`,
              iconSize: [28, 28],
              iconAnchor: [14, 14]
            });

            const marker = L.marker([Number(st.latitude), Number(st.longitude)], {
              icon,
              draggable: true
            }).addTo(layerGroup);

            marker.bindPopup(
              `<div style="font-family:Sarabun,sans-serif;min-width:190px;">
                <div style="font-weight:700;color:#0f172a;">ป้ายลำดับที่ ${idx + 1}: ${st.name}</div>
                ${isRailStudio ? `<div style="font-size:11px;color:#475569;margin-top:2px;">ระดับสถานี: <b>${STATION_LEVELS[stLevel]?.label || 'ระดับดิน'}</b></div>` : ''}
                <div style="font-size:11px;color:#2563eb;margin-top:3px;">💡 ลากหมุดนี้บนแผนที่เพื่อย้ายตำแหน่งได้ทันที</div>
              </div>`
            );

            marker.on('dragend', async ev => {
              const pos = ev.target.getLatLng();
              let newLat = Number(pos.lat.toFixed(5));
              let newLng = Number(pos.lng.toFixed(5));
              const currForm = studioFormRef.current;

              if (stLevel !== 'underground' && currForm.auto_curbside_snap) {
                const snapped = await snapPointToNearestRoad(newLat, newLng, currForm.routing_tier);
                if (snapped.snapped) {
                  newLat = snapped.lat;
                  newLng = snapped.lng;
                }
              }

              setStopsMap(prev => ({
                ...prev,
                [st.id]: {
                  ...prev[st.id],
                  latitude: newLat,
                  longitude: newLng
                }
              }));
            });
          });
          return;
        }

        // 1.5 โหมดค้นหาการเดินทาง (Trip Planner) — แสดงเส้นเดินเท้าตามถนนจริง + เส้นทางรถตามแนวถนนจริง
        if (activeTab === 'trip_planner') {
          const activePlan = tripItineraries[selectedItineraryIndex] || null;

          // วาดเส้นโครงข่ายทั้งหมดแบบจางๆ เป็นพื้นหลังให้เห็นภาพรวมตามสถานะที่เลือก
          routes
            .filter(r => r.visible && Boolean(tripAllowedStatuses[r.operation_status || 'operating']))
            .forEach(r => {
              const stopObjs = (r.stop_ids || []).map(sid => stopsMap[sid]).filter(Boolean);
              const coords =
                Array.isArray(r.road_coordinates) && r.road_coordinates.length >= 2
                  ? r.road_coordinates
                  : stopObjs.map(s => [Number(s.latitude), Number(s.longitude)]);
              if (coords.length >= 2) {
                L.polyline(coords, {
                  color: r.color_hex,
                  weight: 3,
                  opacity: 0.2
                }).addTo(layerGroup);
              }
            });

          if (activePlan && Array.isArray(activePlan.steps)) {
            activePlan.steps.forEach((step, sIdx) => {
              if (step.mode === 'walk' || step.mode === 'transfer_walk') {
                // ใช้พิกัดเดินตามแนวถนนจริง (walkRoadCoords) หากคำนวณเสร็จแล้ว
                const walkCoords =
                  Array.isArray(step.walkRoadCoords) && step.walkRoadCoords.length >= 2
                    ? step.walkRoadCoords
                    : [step.fromCoord, step.toCoord];

                L.polyline(walkCoords, {
                  color: '#ffffff',
                  weight: 7,
                  opacity: 0.75
                }).addTo(layerGroup);

                L.polyline(walkCoords, {
                  color: step.mode === 'transfer_walk' ? '#d97706' : '#0f172a',
                  weight: 4.5,
                  opacity: 0.9,
                  dashArray: '6, 8'
                }).addTo(layerGroup);

                const midPt = walkCoords[Math.floor(walkCoords.length / 2)] || [
                  (step.fromCoord[0] + step.toCoord[0]) / 2,
                  (step.fromCoord[1] + step.toCoord[1]) / 2
                ];

                if (step.distanceMeters >= 60) {
                  const walkBadge = L.divIcon({
                    className: 'walk-step-badge',
                    html: `<div style="background:#0f172a;color:#fff;padding:2px 7px;border-radius:9999px;font-size:10px;font-weight:700;white-space:nowrap;border:1.5px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,0.25);">🚶 เดิน ${step.distanceMeters} ม.</div>`,
                    iconSize: [86, 20],
                    iconAnchor: [43, 10]
                  });
                  L.marker([midPt[0], midPt[1]], { icon: walkBadge }).addTo(layerGroup);
                }
              } else if (step.mode === 'transit' && step.route && Array.isArray(step.passStops)) {
                // ใช้พิกัดตามแนวถนนจริงของสายรถ (roadPathCoords หรือตัดจาก road_coordinates)
                const roadCoords =
                  Array.isArray(step.roadPathCoords) && step.roadPathCoords.length >= 2
                    ? step.roadPathCoords
                    : extractRouteSubpathOnRoad(step.route, step.passStops);

                if (roadCoords.length >= 2) {
                  L.polyline(roadCoords, {
                    color: '#ffffff',
                    weight: 11,
                    opacity: 0.92
                  }).addTo(layerGroup);

                  L.polyline(roadCoords, {
                    color: step.route.color_hex,
                    weight: 7,
                    opacity: 0.98
                  }).addTo(layerGroup);

                  if (step.route.service_type !== 'lrt_concept') {
                    drawDirectionArrowsAlongPath(roadCoords, step.route.color_hex, true, null);
                  }
                }

                // วาดป้ายขึ้นรถและป้ายลงรถของช่วงนี้
                [step.boardStop, step.alightStop].forEach((st, idx) => {
                  if (!st) return;
                  const isBoard = idx === 0;
                  const pinIcon = L.divIcon({
                    className: 'trip-transit-stop-pin',
                    html: `<div style="background:${isBoard ? '#16a34a' : '#dc2626'};color:#fff;padding:2px 8px;border-radius:9999px;font-weight:700;font-size:10px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.3);white-space:nowrap;">${isBoard ? '🟢 ขึ้น' : '🔴 ลง'}: ${st.code || ''}</div>`,
                    iconSize: [84, 22],
                    iconAnchor: [42, 11]
                  });
                  L.marker([Number(st.latitude), Number(st.longitude)], { icon: pinIcon }).addTo(layerGroup);
                });
              }
            });
          }

          // วาดหมุดจุดเริ่มต้น (A) และจุดหมายปลายทาง (B) พร้อมให้ลากย้ายบนแผนที่ได้ด้วย
          if (tripOriginPoint) {
            const origIcon = L.divIcon({
              className: 'trip-origin-pin',
              html: `<div style="background:#16a34a;color:#fff;padding:3px 9px;border-radius:9999px;font-weight:800;font-size:11px;border:2.5px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,0.35);white-space:nowrap;cursor:grab;">🟢 ต้นทาง: ${tripOriginPoint.name.slice(0, 18)}</div>`,
              iconSize: [140, 26],
              iconAnchor: [70, 13]
            });
            const origMarker = L.marker([tripOriginPoint.lat, tripOriginPoint.lng], {
              icon: origIcon,
              draggable: true
            }).addTo(layerGroup);
            origMarker.on('dragend', ev => {
              const pos = ev.target.getLatLng();
              const nextPt = {
                name: `จุดเริ่มต้นบนแผนที่ (${pos.lat.toFixed(4)}, ${pos.lng.toFixed(4)})`,
                lat: Number(pos.lat.toFixed(5)),
                lng: Number(pos.lng.toFixed(5))
              };
              setTripOriginPoint(nextPt);
              setTripOriginText(nextPt.name);
            });
          }

          if (tripDestPoint) {
            const destIcon = L.divIcon({
              className: 'trip-dest-pin',
              html: `<div style="background:#e11d48;color:#fff;padding:3px 9px;border-radius:9999px;font-weight:800;font-size:11px;border:2.5px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,0.35);white-space:nowrap;cursor:grab;">🏁 ปลายทาง: ${tripDestPoint.name.slice(0, 18)}</div>`,
              iconSize: [150, 26],
              iconAnchor: [75, 13]
            });
            const destMarker = L.marker([tripDestPoint.lat, tripDestPoint.lng], {
              icon: destIcon,
              draggable: true
            }).addTo(layerGroup);
            destMarker.on('dragend', ev => {
              const pos = ev.target.getLatLng();
              const nextPt = {
                name: `จุดหมายบนแผนที่ (${pos.lat.toFixed(4)}, ${pos.lng.toFixed(4)})`,
                lat: Number(pos.lat.toFixed(5)),
                lng: Number(pos.lng.toFixed(5))
              };
              setTripDestPoint(nextPt);
              setTripDestText(nextPt.name);
            });
          }

          return;
        }

        // 2. โหมดแผนที่รวม / รายละเอียดสาย / ตารางป้าย (กรองตามสถานะที่เลือกเปิดแสดงผล)
        const routesToDraw = routes.filter(
          r => r.visible && Boolean(enabledOperationStatuses[r.operation_status || 'operating'])
        );

        routesToDraw.forEach(route => {
          const isSelected = route.id === selectedRouteId;
          const isRail = Boolean(SERVICE_TYPES[route.service_type]?.supportsStationLevels);

          drawRouteGeometryLayers(route, isSelected, () => {
            setSelectedRouteId(route.id);
            setActiveTab('detail');
          });

          const routeStops = (route.stop_ids || []).map(sid => stopsMap[sid]).filter(Boolean);
          routeStops.forEach((st, idx) => {
            const isOrigin = idx === 0;
            const isDest = idx === routeStops.length - 1;
            const stLevel = isRail ? st.station_level || 'at_grade' : 'at_grade';

            let dotColor = route.color_hex;
            if (st.leg === 'green_outbound') dotColor = '#16a34a';
            else if (st.leg === 'red_inbound') dotColor = '#dc2626';
            else if (st.leg === 'orange_outbound') dotColor = '#ea580c';
            else if (st.leg === 'blue_inbound') dotColor = '#2563eb';
            if (isRail && stLevel === 'underground') dotColor = '#6d28d9';
            else if (isRail && stLevel === 'elevated') dotColor = '#0284c7';

            if (isOrigin) dotColor = '#16a34a';
            else if (isDest && routeStops.length > 1) dotColor = '#dc2626';

            const size = isOrigin || isDest || st.isTerminal || (isRail && stLevel !== 'at_grade') ? 20 : 12;
            const badgeText = isRail && stLevel === 'underground' ? '🚇' : isRail && stLevel === 'elevated' ? '🚝' : '';

            const markerIcon = L.divIcon({
              className: 'custom-route-stop',
              html: `<div style="background:${dotColor};color:#fff;width:${size}px;height:${size}px;border-radius:9999px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,0.35);display:flex;align-items:center;justify-content:center;font-size:10px;">${badgeText}</div>`,
              iconSize: [size, size],
              iconAnchor: [size / 2, size / 2]
            });

            const m = L.marker([Number(st.latitude), Number(st.longitude)], { icon: markerIcon }).addTo(layerGroup);

            if (showStopLabels && (isSelected || st.isTerminal || (isRail && stLevel !== 'at_grade'))) {
              m.bindTooltip(st.name, {
                permanent: true,
                direction: 'top',
                offset: [0, -8],
                className: 'text-xs font-semibold bg-white/95 border border-slate-300 rounded px-1.5 py-0.5 shadow'
              });
            }

            m.bindPopup(
              `<div style="font-family:Sarabun,sans-serif;min-width:210px;">
                <div style="font-size:11px;font-weight:700;color:${route.color_hex};">${route.code} • ${isOrigin ? '🟢 จุดเริ่มต้น' : isDest ? '🔴 จุดสิ้นสุด' : `ป้ายลำดับที่ ${idx + 1}`}</div>
                <div style="font-size:13px;font-weight:700;color:#0f172a;margin-top:2px;">${st.name}</div>
                ${isRail ? `<div style="font-size:11px;color:#334155;margin-top:3px;">โครงสร้างรถไฟฟ้า: <b>${STATION_LEVELS[stLevel]?.label || 'ระดับดิน'}</b></div>` : ''}
                ${st.road_side ? `<div style="font-size:11px;color:#0369a1;margin-top:2px;">📍 ${st.road_side}</div>` : ''}
                <div style="font-size:10px;color:#64748b;margin-top:4px;">พิกัด: ${Number(st.latitude).toFixed(5)}, ${Number(st.longitude).toFixed(5)}</div>
              </div>`
            );
          });
        });

        // 3. วาดจุดเชื่อมต่อเปลี่ยนสายรถ (Transfer Hubs)
        if (showTransferHubs) {
          transferIntersections.forEach(hub => {
            const ringColor = hub.isVerticalTransfer ? '#7c3aed' : '#f59e0b';
            const hubIcon = L.divIcon({
              className: 'transfer-hub-marker',
              html: `<div style="position:relative;width:28px;height:28px;display:flex;align-items:center;justify-content:center;">
                <div class="transfer-hub-pulse" style="position:absolute;inset:0;border-radius:9999px;border:3px solid ${ringColor};background:rgba(245,158,11,0.18);"></div>
                <div style="width:14px;height:14px;border-radius:9999px;background:${ringColor};border:2.5px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,0.3);"></div>
              </div>`,
              iconSize: [28, 28],
              iconAnchor: [14, 14]
            });

            const hubMarker = L.marker([hub.centerLat, hub.centerLng], { icon: hubIcon }).addTo(layerGroup);
            hubMarker.bindPopup(
              `<div style="font-family:Sarabun,sans-serif;min-width:220px;">
                <div style="font-weight:700;color:#b45309;font-size:12px;">🔄 จุดเชื่อมต่อเปลี่ยนสายรถ ${hub.isVerticalTransfer ? '(ต่างระดับ 🛗)' : ''}</div>
                <div style="font-size:12px;font-weight:700;color:#0f172a;margin-top:3px;">${hub.stopA.name}</div>
                <div style="font-size:11px;color:#334155;margin-top:4px;">
                  • <b>${hub.routeA.code}</b><br/>
                  • <b>${hub.routeB.code}</b>
                </div>
                <div style="font-size:11px;color:#059669;font-weight:600;margin-top:4px;">
                  ${hub.isSharedStop ? 'ใช้ป้ายจุดจอดเดียวกัน (0 เมตร)' : `ระยะเดินเชื่อมต่อประมาณ ${hub.distanceMeters} เมตร`}
                </div>
              </div>`
            );
          });
        }
      }, [routes, stopsMap, activeTab, selectedRouteId, studioForm, showTransferHubs, showStopLabels, showDirectionArrows, transferIntersections, tripItineraries, selectedItineraryIndex, tripOriginPoint, tripDestPoint, enabledOperationStatuses, tripAllowedStatuses]);

      const fitMapToRoute = route => {
        const map = mapInstanceRef.current;
        if (!map || !route) return;
        const pts = (route.stop_ids || [])
          .map(sid => stopsMap[sid])
          .filter(st => st && Number.isFinite(Number(st.latitude)) && Number.isFinite(Number(st.longitude)))
          .map(s => [Number(s.latitude), Number(s.longitude)]);
        if (pts.length >= 2) {
          try {
            map.fitBounds(L.latLngBounds(pts), { padding: [50, 50], maxZoom: 15 });
          } catch {}
        } else if (pts.length === 1) {
          map.setView(pts[0], 15);
        }
      };

      const focusStopOnMap = stopObj => {
        const map = mapInstanceRef.current;
        if (!map || !stopObj) return;
        map.setView([Number(stopObj.latitude), Number(stopObj.longitude)], 16);
      };

      const startCreateNewRoute = (presetType = 'feeder') => {
        const isLrt = presetType === 'lrt_concept';
        const autoColor = getAvailableRouteColor(routes, isLrt);
        setEditingRouteId(null);
        setInsertIndexMode(null);
        setStudioForm({
          code: isLrt ? `LRT-${routes.length + 1}` : `สาย ${routes.length + 21}`,
          name: isLrt ? 'สายรถไฟฟ้าใหม่' : '',
          color_hex: autoColor,
          service_type: isLrt ? 'lrt_concept' : presetType,
          operation_status: isLrt ? 'future_project' : 'suggested_route',
          routing_tier: SERVICE_TYPES[presetType]?.tier || 'local_soi_allowed',
          geometry_type: 'verified_road_network',
          snap_to_road: true,
          auto_curbside_snap: true,
          default_new_station_level: isLrt ? 'elevated' : 'at_grade',
          is_admin_locked: false,
          stop_ids: [],
          road_coordinates: null,
          segment_layers: null,
          road_distance_meters: null,
          soi_segments_detected: [],
          proposer_name: '',
          target_communities: '',
          mobility_pain_points: '',
          key_landmarks: '',
          change_summary: 'สร้างเส้นทางใหม่'
        });
        setActiveTab('studio');
        showNotification('คลิกบนแผนที่เพื่อปักจุดจอดตามลำดับ หรือกดปุ่ม "+ แทรกจุดจอด" ระหว่างป้ายได้ทันทีครับ', 'info');
      };

      const startEditRoute = route => {
        if (!route) return;
        if (route.is_admin_locked && !isAdminMode) {
          showNotification('🔒 เส้นทางหลักนี้ถูกล็อกโดยแอดมิน (สลับเป็นโหมดแอดมินมุมขวาบนหากต้องการปลดล็อกเพื่อแก้ไข)', 'error');

        }
