    function formatThaiDateTime(isoString) {
      if (!isoString) return 'ไม่ระบุเวลา';
      try {
        const d = new Date(isoString);
        if (isNaN(d.getTime())) return 'ไม่ระบุเวลา';
        return d.toLocaleString('th-TH', {
          day: 'numeric',
          month: 'short',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        }) + ' น.';
      } catch {
        return 'ไม่ระบุเวลา';
      }
    }

    function extractRouteSubpathOnRoad(routeObj, passStops) {
      if (!Array.isArray(passStops) || passStops.length < 2) return [];
      const boardStop = passStops[0];
      const alightStop = passStops[passStops.length - 1];
      const roadCoords = routeObj?.road_coordinates;

      if (!Array.isArray(roadCoords) || roadCoords.length < 2) {
        return passStops.map(st => [Number(st.latitude), Number(st.longitude)]);
      }

      const bLat = Number(boardStop.latitude);
      const bLng = Number(boardStop.longitude);
      const aLat = Number(alightStop.latitude);
      const aLng = Number(alightStop.longitude);

      let startIdx = 0;
      let minStartDist = Infinity;
      for (let i = 0; i < roadCoords.length; i++) {
        const d = calculateHaversineMeters(bLat, bLng, roadCoords[i][0], roadCoords[i][1]);
        if (d < minStartDist) {
          minStartDist = d;
          startIdx = i;
        }
      }

      let endIdx = startIdx;
      let minEndDist = Infinity;
      for (let i = startIdx; i < roadCoords.length; i++) {
        const d = calculateHaversineMeters(aLat, aLng, roadCoords[i][0], roadCoords[i][1]);
        if (d < minEndDist) {
          minEndDist = d;
          endIdx = i;
        }
      }

      if (endIdx > startIdx) {
        return roadCoords.slice(startIdx, endIdx + 1);
      }
      return passStops.map(st => [Number(st.latitude), Number(st.longitude)]);
    }

    function estimateWalkMinutes(meters) {
      return Math.max(1, Math.round(meters / 75));
    }

    function computeTransitItineraries(originPt, destPt, activeRoutes, stopsMap) {
      if (!originPt || !destPt) return [];
      const results = [];
      const directWalkMeters = calculateHaversineMeters(originPt.lat, originPt.lng, destPt.lat, destPt.lng);

      const routeStopLists = activeRoutes
        .map(r => {
          const stops = (r.stop_ids || [])
            .map((sid, idx) => {
              const st = stopsMap[sid];
              return st ? { ...st, seqIndex: idx } : null;
            })
            .filter(Boolean);
          return { route: r, stops };
        })
        .filter(item => item.stops.length >= 2);

      routeStopLists.forEach(({ route, stops }) => {
        let bestSingleForRoute = null;

        for (let i = 0; i < stops.length - 1; i++) {
          const boardStop = stops[i];
          const walkToBoard = calculateHaversineMeters(originPt.lat, originPt.lng, boardStop.latitude, boardStop.longitude);
          if (walkToBoard > 4500) continue; 

          for (let j = i + 1; j < stops.length; j++) {
            const alightStop = stops[j];
            const walkFromAlight = calculateHaversineMeters(alightStop.latitude, alightStop.longitude, destPt.lat, destPt.lng);
            if (walkFromAlight > 4500) continue;

            const stopCount = j - i;
            const isRail = route.service_type === 'lrt_concept';
            const transitMins = Math.max(2, Math.round(stopCount * (isRail ? 2.0 : 2.6)));
            const walkMins = estimateWalkMinutes(walkToBoard) + estimateWalkMinutes(walkFromAlight);
            const totalScore = walkToBoard * 2.2 + walkFromAlight * 2.2 + stopCount * 180;

            if (!bestSingleForRoute || totalScore < bestSingleForRoute.score) {
              const passStops = stops.slice(i, j + 1);
              bestSingleForRoute = {
                id: `itin-single-${route.id}-${i}-${j}`,
                type: 'single_route',
                badge: 'ต่อเดียวถึง (ไม่ต้องเปลี่ยนสาย)',
                score: totalScore,
                totalMinutes: walkMins + transitMins,
                totalWalkMeters: walkToBoard + walkFromAlight,
                transferCount: 0,
                steps: [
                  {
                    mode: 'walk',
                    fromName: originPt.name,
                    toName: boardStop.name,
                    fromCoord: [originPt.lat, originPt.lng],
                    toCoord: [Number(boardStop.latitude), Number(boardStop.longitude)],
                    distanceMeters: walkToBoard,
                    durationMinutes: estimateWalkMinutes(walkToBoard)
                  },
                  {
                    mode: 'transit',
                    route,
                    boardStop,
                    alightStop,
                    stopCount,
                    passStops,
                    durationMinutes: transitMins
                  },
                  {
                    mode: 'walk',
                    fromName: alightStop.name,
                    toName: destPt.name,
                    fromCoord: [Number(alightStop.latitude), Number(alightStop.longitude)],
                    toCoord: [destPt.lat, destPt.lng],
                    distanceMeters: walkFromAlight,
                    durationMinutes: estimateWalkMinutes(walkFromAlight)
                  }
                ]
              };
            }
          }
        }

        if (bestSingleForRoute) {
          results.push(bestSingleForRoute);
        }
      });

      for (let a = 0; a < routeStopLists.length; a++) {
        for (let b = 0; b < routeStopLists.length; b++) {
          if (a === b) continue;
          const rA = routeStopLists[a];
          const rB = routeStopLists[b];

          const candidateBoardsA = rA.stops
            .map(st => ({
              stop: st,
              dist: calculateHaversineMeters(originPt.lat, originPt.lng, st.latitude, st.longitude)
            }))
            .filter(x => x.dist <= 4500)
            .sort((x, y) => x.dist - y.dist)
            .slice(0, 3);

          const candidateAlightsB = rB.stops
            .map(st => ({
              stop: st,
              dist: calculateHaversineMeters(st.latitude, st.longitude, destPt.lat, destPt.lng)
            }))
            .filter(x => x.dist <= 4500)
            .sort((x, y) => x.dist - y.dist)
            .slice(0, 3);

          if (candidateBoardsA.length === 0 || candidateAlightsB.length === 0) continue;

          let bestTransferPair = null;

          candidateBoardsA.forEach(boardAItem => {
            const boardA = boardAItem.stop;
            for (let idxA = boardA.seqIndex + 1; idxA < rA.stops.length; idxA++) {
              const transferStopA = rA.stops[idxA];

              candidateAlightsB.forEach(alightBItem => {
                const alightB = alightBItem.stop;
                for (let idxB = 0; idxB < alightB.seqIndex; idxB++) {
                  const transferStopB = rB.stops[idxB];
                  const transferWalk = calculateHaversineMeters(
                    transferStopA.latitude,
                    transferStopA.longitude,
                    transferStopB.latitude,
                    transferStopB.longitude
                  );

                  if (transferWalk <= 450) {
                    const stopsCountA = idxA - boardA.seqIndex;
                    const stopsCountB = alightB.seqIndex - idxB;
                    const totalWalk = boardAItem.dist + transferWalk + alightBItem.dist;
                    const transitMinsA = Math.max(2, Math.round(stopsCountA * (rA.route.service_type === 'lrt_concept' ? 2.0 : 2.6)));
                    const transitMinsB = Math.max(2, Math.round(stopsCountB * (rB.route.service_type === 'lrt_concept' ? 2.0 : 2.6)));
                    const totalMins =
                      estimateWalkMinutes(boardAItem.dist) +
                      transitMinsA +
                      estimateWalkMinutes(transferWalk) +
                      4 +
                      transitMinsB +
                      estimateWalkMinutes(alightBItem.dist);

                    const score = totalWalk * 2.2 + (stopsCountA + stopsCountB) * 180 + 550; 

                    if (!bestTransferPair || score < bestTransferPair.score) {
                      bestTransferPair = {
